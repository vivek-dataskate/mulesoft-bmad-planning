name: Regenerate Capabilities Portal

on:
  push:
    branches: [main]
    paths:
      - 'standards/connector-registry.json'
      - 'standards/snippet-registry.json'
      - 'playbooks/**'
      - 'projects/**/decisions.json'
      - 'scaffold/generate-capabilities.js'
  workflow_dispatch:   # Allow manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  generate-capabilities:
    runs-on: ubuntu-latest
    name: Generate Capabilities Portal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate capabilities portal
        run: node scaffold/generate-capabilities.js

      - name: Check if portal changed
        id: changed
        run: |
          if git diff --quiet docs/capabilities/index.html 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated portal
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.email "bmad-scaffold@noreply.github.com"
          git config user.name "BMAD Scaffold (GitHub Actions)"
          git add docs/capabilities/index.html
          git commit -m "chore: regenerate capabilities portal [skip ci]"
          git push
