name: Generate Client Progress Report

# Regenerate client-report.html whenever stories or decisions change
on:
  push:
    branches: [main]
    paths:
      - 'projects/*/stories.md'
      - 'projects/*/decisions.json'
  workflow_dispatch:
    inputs:
      client:
        description: 'Client name (e.g. leolabs) — leave blank to regenerate all'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-reports:
    name: Generate Client Reports
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Detect changed clients
        id: detect
        run: |
          if [[ -n "${{ github.event.inputs.client }}" ]]; then
            echo "clients=${{ github.event.inputs.client }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Find clients whose stories.md or decisions.json changed
          CHANGED=$(git diff --name-only HEAD~1 HEAD | grep -E '^projects/[^/]+/(stories|decisions)' | sed 's|projects/\([^/]*\)/.*|\1|' | sort -u || true)
          if [ -z "$CHANGED" ]; then
            # Fallback: regenerate all clients that have decisions.json
            CHANGED=$(find projects -name decisions.json -mindepth 2 -maxdepth 2 | sed 's|projects/\([^/]*\)/.*|\1|' | sort -u)
          fi
          echo "clients=$(echo "$CHANGED" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Generate reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_DEPLOY_TOKEN || '' }}
          GITHUB_ORG:   ${{ vars.GITHUB_ORG || '' }}
        run: |
          CLIENTS="${{ steps.detect.outputs.clients }}"
          if [ -z "$CLIENTS" ]; then echo "No clients to process."; exit 0; fi
          for CLIENT in $CLIENTS; do
            DECISIONS="projects/$CLIENT/decisions.json"
            if [ ! -f "$DECISIONS" ]; then
              echo "⚠  Skipping $CLIENT — decisions.json not found"
              continue
            fi
            echo "→ Generating report for $CLIENT..."
            node scaffold/generate-client-report.js "$DECISIONS"
          done

      - name: Commit reports
        run: |
          git config user.name  "BMAD Pipeline"
          git config user.email "bmad-pipeline@noreply.github.com"
          git add 'projects/*/client-report.html'
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: regenerate client progress reports [skip ci]"
            git push
          fi
