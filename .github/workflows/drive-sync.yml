name: Google Drive → GitHub Intake Sync

# Runs every 20 minutes. Checks the configured Drive folder for new client
# intake files, validates them, commits valid ones, and posts Slack notifications.
#
# Required repository secrets:
#   GOOGLE_SERVICE_ACCOUNT_JSON  — service account key JSON (from GCP IAM)
#   DRIVE_INTAKE_FOLDER_ID       — Google Drive root folder ID
#   ANTHROPIC_API_KEY            — for the validation agent
#   SLACK_BOT_TOKEN              — Slack bot token (xoxb-...)
#   SLACK_PIPELINE_CHANNEL       — channel ID for internal pipeline notifications
#   GITHUB_DEPLOY_TOKEN          — PAT with repo:write (for git push)
#
# Required repository variables (Settings → Variables):
#   SLACK_PIPELINE_CHANNEL       — channel ID (can also be a secret)
#
# Setup steps:
#   1. GCP: Create project → enable Drive API → create service account
#          → download JSON key → store as GOOGLE_SERVICE_ACCOUNT_JSON secret
#   2. Drive: Share the intake root folder with the service account email (Viewer)
#   3. Slack: Create a Slack App → add bot scopes:
#             chat:write, canvases:write, canvases:read, channels:read
#          → install to workspace → store bot token as SLACK_BOT_TOKEN

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch:          # allow manual trigger from GitHub Actions UI
    inputs:
      dry_run:
        description: 'Dry run (no commits, no Slack posts)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync-drive:
    name: Sync Drive Intake
    runs-on: ubuntu-latest

    steps:

      - name: Checkout (with write token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_DEPLOY_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure git
        run: |
          git config user.name  "BMAD Drive Sync"
          git config user.email "bmad-drive@noreply.github.com"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install --no-save @anthropic-ai/sdk

      - name: Run Drive watcher + validate
        id: drive
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_INTAKE_FOLDER_ID:      ${{ secrets.DRIVE_INTAKE_FOLDER_ID }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN:                     ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          DRY_FLAG=""
          [ "$DRY_RUN" = "true" ] && DRY_FLAG="--dry-run"
          node scaffold/google-drive-watcher.js $DRY_FLAG

      - name: Push committed intake files
        if: steps.drive.outputs.valid_clients != ''
        run: |
          git pull --rebase origin main || true
          git push origin main || echo "Nothing to push"

      - name: Post Slack notifications via Slack agent
        if: steps.drive.outputs.valid_clients != '' || steps.drive.outputs.invalid_clients != ''
        env:
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_BOT_TOKEN:       ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL:         ${{ secrets.SLACK_PIPELINE_CHANNEL || vars.SLACK_PIPELINE_CHANNEL }}
          VALIDATION_RESULTS_B64: ${{ steps.drive.outputs.validation_results }}
          VALID_CLIENTS:         ${{ steps.drive.outputs.valid_clients }}
          INVALID_CLIENTS:       ${{ steps.drive.outputs.invalid_clients }}
          PIPELINE_STAGE:        intake_validation
        run: node scaffold/slack-agent.js

      - name: Summary
        if: always()
        run: |
          echo "Valid clients (committed):   ${{ steps.drive.outputs.valid_clients || 'none' }}"
          echo "Invalid clients (rejected):  ${{ steps.drive.outputs.invalid_clients || 'none' }}"
