name: Regenerate Client Portals

# Triggers whenever stories, decisions, or project config changes for any client.
# Generates portal HTML and deploys to Firebase Hosting so clients see live updates.
#
# Required secrets (Settings → Secrets → Actions):
#   FIREBASE_SA_KEY  — Firebase service account JSON (same as Codespaces secret)

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min — picks up sprint changes from client repos
  push:
    branches: [main]
    paths:
      - 'projects/*/decisions.json'
      - 'projects/*/project.json'
      - 'projects/*/intake/responses.json'
      - 'scaffold/generate-client-portal.js'
  workflow_dispatch:
    inputs:
      client:
        description: 'Client slug (e.g. zyris) — leave blank to regenerate all'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy-portals:
    name: Generate & Deploy Portals
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate portal HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_DEPLOY_TOKEN }}
        run: |
          CLIENT="${{ github.event.inputs.client }}"
          if [ -n "$CLIENT" ]; then
            node scaffold/generate-client-portal.js "$CLIENT"
          else
            node scaffold/generate-client-portal.js
          fi

      - name: Generate knowledge base
        run: node scaffold/generate-knowledge-base.js

      - name: Sync intake + proposal HTML into firebase/public
        run: |
          mkdir -p firebase/public/intake firebase/public/proposal
          for html in projects/*/intake/intake-questionnaire-*.html; do
            [ -f "$html" ] || continue
            slug=$(basename "$html" | sed 's/intake-questionnaire-//' | sed 's/\.html//')
            cp "$html" "firebase/public/intake/${slug}.html"
          done
          for html in projects/*/intake/proposal-*.html; do
            [ -f "$html" ] || continue
            slug=$(basename "$html" | sed 's/proposal-//' | sed 's/\.html//')
            cp "$html" "firebase/public/proposal/${slug}.html"
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Deploy to Firebase Hosting
        run: |
          cd firebase
          npm install --prefix functions --silent
          npx firebase-tools deploy --only hosting --project dataskateclients --force
