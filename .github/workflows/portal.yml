name: Regenerate Client Portals

# Triggers whenever stories, decisions, or project config changes for any client.
# Generates portal HTML and deploys to Firebase Hosting so clients see live updates.
#
# Required secrets (Settings → Secrets → Actions):
#   FIREBASE_SA_KEY  — Firebase service account JSON (same as Codespaces secret)

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client slug (e.g. zyris) — leave blank to regenerate all'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy-portals:
    name: Generate & Deploy Portals
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate portal HTML
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_DEPLOY_TOKEN }}
        run: |
          CLIENT="${{ github.event.inputs.client }}"
          if [ -n "$CLIENT" ]; then
            node pipeline/tools/generate-client-portal.js "$CLIENT"
          else
            node pipeline/tools/generate-client-portal.js
          fi

      - name: Generate knowledge base
        run: node pipeline/tools/generate-knowledge-base.js

      - name: Sync intake + proposal HTML into portal/public
        run: |
          mkdir -p portal/public/intake portal/public/proposal
          for html in projects/*/intake/intake-questionnaire-*.html; do
            [ -f "$html" ] || continue
            slug=$(basename "$html" | sed 's/intake-questionnaire-//' | sed 's/\.html//')
            cp "$html" "portal/public/intake/${slug}.html"
          done
          for html in projects/*/intake/proposal-*.html; do
            [ -f "$html" ] || continue
            slug=$(basename "$html" | sed 's/proposal-//' | sed 's/\.html//')
            cp "$html" "portal/public/proposal/${slug}.html"
          done

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Puppeteer browser
        run: npx puppeteer browsers install chrome

      - name: Intake structural tests — DOM & code checks (no browser)
        run: npm run test:intake:structural

      - name: Intake behavioral tests — Puppeteer interactions + regressions
        run: npm run test:intake:behavioral

      - name: Upload behavioral test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intake-test-failure-${{ github.run_id }}
          path: portal/tests/intake/
          retention-days: 7

      - name: HTML contract tests — shared + per-type contracts for all generated pages
        run: npm run test:html

      - name: Upload HTML contract failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: html-contract-failure-${{ github.run_id }}
          path: portal/tests/html/
          retention-days: 7

      - name: Visual regression — intake pixel diff gate (BackstopJS)
        run: |
          node pipeline/scripts/generate-backstop-config.js --intake
          npx backstop test --config portal/tests/backstop/backstop.json

      - name: Upload VR diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vr-diff-${{ github.run_id }}
          path: portal/tests/backstop/backstop_data/html_report/
          retention-days: 7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}

      - name: Deploy to Firebase Hosting
        run: |
          cd portal
          npm install --prefix functions --silent
          npx firebase-tools deploy --only hosting --project dataskateclients --force
