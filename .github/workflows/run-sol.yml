name: Run Sol — SOW Generator

on:
  workflow_dispatch:
    inputs:
      client:
        description: 'Client slug (e.g. peerless)'
        required: true
        type: string
      triggered_by:
        description: 'acceptance (skip guard) or manual (check project.json)'
        default: 'manual'

jobs:
  run-sol:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sol (SOW agent)
        run: node pipeline/langgraph/orchestrator.mjs --client "${{ inputs.client }}" --agent sol
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SOL_TRIGGERED_BY_ACCEPTANCE: ${{ inputs.triggered_by == 'acceptance' && 'true' || 'false' }}

      - name: Build SOW HTML
        run: npm run build:html

      - name: Copy SOW to public
        run: |
          SLUG="${{ inputs.client }}"
          mkdir -p portal/public/delivery
          SRC="portal/_build/delivery/sow-${SLUG}.html"
          if [ -f "$SRC" ]; then
            cp "$SRC" "portal/public/delivery/sow-${SLUG}.html"
            echo "SOW copied to portal/public/delivery/sow-${SLUG}.html"
          else
            echo "WARNING: $SRC not found — skipping copy"
          fi

      - name: Update portal-content.json SOW card
        run: |
          SLUG="${{ inputs.client }}"
          python3 -c "
          import json, sys
          path = f'projects/{SLUG}/portal-content.json'
          try:
            d = json.load(open(path))
          except Exception as e:
            print(f'WARNING: could not read {path}: {e}', file=sys.stderr)
            sys.exit(0)
          for card in d.get('docCards', []):
            if card.get('title') == 'SOW':
              card['status'] = 'available'
              card['href'] = f'https://dataskateclients.web.app/delivery/sow-{SLUG}.html'
              card['sub'] = 'View & Sign SOW →'
              break
          open(path, 'w').write(json.dumps(d, indent=2, ensure_ascii=False))
          print(f'portal-content.json updated for {SLUG}')
          "

      - name: Rebuild portal page
        run: |
          SLUG="${{ inputs.client }}"
          npm run build:html
          SRC="portal/_build/portal/${SLUG}.html"
          if [ -f "$SRC" ]; then
            mkdir -p portal/public/portal
            cp "$SRC" "portal/public/portal/${SLUG}.html"
            echo "Portal page copied to portal/public/portal/${SLUG}.html"
          else
            echo "WARNING: $SRC not found — skipping portal copy"
          fi

      - name: Commit SOW artifacts
        run: |
          SLUG="${{ inputs.client }}"
          git config user.name  "DataSkate Bot"
          git config user.email "bot@dataskate.ai"
          git add \
            "projects/${SLUG}/scoping/run/sol.json" \
            "portal/public/delivery/sow-${SLUG}.html" \
            "projects/${SLUG}/project.json" \
            "projects/${SLUG}/portal-content.json" \
            "portal/public/portal/${SLUG}.html" \
            --ignore-missing
          git diff --cached --quiet && echo "Nothing to commit" || \
            git commit -m "delivery: Sol SOW generated for ${SLUG} [skip ci]"
          git push

      - name: Deploy SOW to Firebase Hosting
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
        run: |
          if [ -n "$FIREBASE_SA_KEY" ]; then
            ./portal/deploy.sh "${{ inputs.client }}" sow
          else
            echo "FIREBASE_SA_KEY not set — skipping Firebase deploy"
          fi
