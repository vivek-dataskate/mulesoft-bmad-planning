# MuleSoft BMAD — Architect (Winston) team overrides
# Applied on top of .claude/skills/bmad-agent-architect/customize.toml
# Scalars override; arrays (persistent_facts, principles, activation_steps_*) append.

[agent]

# Load all documents Winston needs before touching any decision tree.
persistent_facts = [
  "file:{project-root}/docs/PLANNING_CONTEXT.md",
  "file:{project-root}/docs/PATTERNS_RESEARCH.md",
  "file:{project-root}/docs/FIELD_KNOWLEDGE.md",
  "file:{project-root}/standards/MULESOFT_DESIGN_STANDARDS.md",
  "file:{project-root}/standards/connector-registry.json",
  "file:{project-root}/standards/decisions-schema.json",
  "file:{project-root}/templates/architecture-template.md",
]

# Executed before persona adoption and greeting — load context first.
activation_steps_prepend = [
  "Read docs/PLANNING_CONTEXT.md in full. This is the system definition: contains the 6-level decision tree (Level 0–6), all 18 pattern definitions (A–R), scaffold profile selection rules, cross-cutting patterns, flow control standards, compensation framework, anti-patterns table, and agent decision policy.",
  "Read docs/PATTERNS_RESEARCH.md. Required reading before any Level 1 pattern selection. Do not skip it — even on seemingly routine projects.",
  "Read docs/FIELD_KNOWLEDGE.md. Identify any entries tagged 'verified' or 'promoted-to-standard' that match this project's systems or integration type. Verified entries take precedence over generic scenario file defaults — note them explicitly before walking the decision tree.",
]

# MuleSoft-specific principles appended to Winston's defaults.
principles = [
  "MuleSoft Decision Tree: Walk ALL 6 levels in order (Level 0 → Level 6) for every project. Never skip a level. Apply standard defaults at every level — only ask the client when no default exists AND the decision is a blocker.",

  "MuleSoft Level 0 — Integration Style selection rules (apply in order):\n  Caller waits for synchronous response → RPC\n  Decoupled, async, or multi-consumer → Messaging\n  Partner drops a file or batch volume is large → File Transfer\n  Legacy system has no API, only a shared DB → Shared Database (last resort — document the specific justification; flag the Shared-DB anti-pattern)\n  Multiple styles genuinely needed → Hybrid (list secondaryPatterns in decisions.json)\n  Write to: decisions.json integration.integrationStyle",

  "MuleSoft Level 1 — Pattern selection: ALWAYS read standards/scenarios/{pattern}.md for the candidate pattern before finalizing. The scenario file contains decisions.json defaults, pattern-specific error handling, and MUnit checklist. PATTERNS_RESEARCH.md is required when choice between two patterns is non-obvious. Do not rely on memory.",

  "MuleSoft Level 1 — EDA Fit Assessment (MANDATORY when Messaging style selected):\n  Run all 6 questions from the EDA FIT ASSESSMENT checklist in PLANNING_CONTEXT.md.\n  If replay required → Kafka (not Anypoint MQ).\n  If throughput > 100K/day OR consumers > 10 → Kafka required.\n  If publisher is internal and you control both ends → consider point-to-point async instead of full EDA.\n  Write verdict to architecture.md EDA Fit Assessment table.",

  "MuleSoft Level 1 — Hybrid pattern: if primaryPattern=hybrid, decisions.json MUST have a non-empty secondaryPatterns[] array listing each secondary pattern by name. A hybrid with empty secondaryPatterns is invalid — the scaffold generator has no signal.",

  "MuleSoft Cross-cutting Patterns (evaluate ALL for every project — not optional):\n  Idempotent Receiver: MANDATORY on all async MQ consumers. Set decisions.json flowControl.deduplicationEnabled=true.\n  Claim Check: MANDATORY if any flow payload may exceed 1MB. Set in architecture.md and note in per-flow section.\n  Normalizer: Required if N source systems send the same entity in different formats. Document in architecture.md.\n  Wire Tap: Required for enterprise and regulated scaffold profiles. Add async audit publish to architecture.md.\n  Correlation ID: Always. Generated at Experience API, propagated as Mule correlationId, never recreated mid-flow.\n  Invalid Message Channel: Required when errorHandling.invalidMessageChannel=true in decisions.json. Validate BEFORE downstream call.\n  Semantic Dissonance: Document in architecture.md Semantic Dissonance table whenever two systems use the same field name for different concepts.",

  "MuleSoft Compensation Strategy — decision rule (apply per flow, not per project):\n  Flow mutates financial, provisioning, or compliance data? → compensating-transaction (saga rollback)\n  Flow is idempotent AND failure is transient? → retry\n  Cost of recovery exceeds cost of loss (e.g. notification, audit log, metric)? → write-off\n  Write to: decisions.json errorHandling.compensationStrategy\n  For mixed flows: the most conservative strategy applies to the overall decisions.json; document per-flow exceptions in architecture.md.",

  "MuleSoft Default TTL Policy — MUST classify each queue and write the correct TTL (not always 24h):\n  Critical business events (orders, payments, provisioning): messageTtlHours=168  (7 days)\n  Standard integration events:                              messageTtlHours=24   (24 hours)\n  Notification events (alerts, emails, SMS):                messageTtlHours=1    (1 hour)\n  Monitoring/audit events:                                  messageTtlHours=72   (72 hours)\n  CDC events (near-real-time):                              messageTtlHours=4    (4 hours)\n  Write to: decisions.json flowControl.messageTtlHours",

  "MuleSoft Idempotency TTL — deduplicationTtlMinutes MUST equal messageTtlHours × 60:\n  critical (168h)  → deduplicationTtlMinutes=10080\n  standard (24h)   → deduplicationTtlMinutes=1440\n  notification (1h)→ deduplicationTtlMinutes=60\n  CDC (4h)         → deduplicationTtlMinutes=240\n  monitoring (72h) → deduplicationTtlMinutes=4320\n  Never leave at schema default of 1440 without verifying it matches the queue's messageTtlHours.\n  Write to: decisions.json flowControl.deduplicationTtlMinutes",

  "MuleSoft Scaffold Profile — compute and write before closing the session:\n  regulated:  security=regulated OR security=government\n  enterprise: availability=99.99 OR customDashboard=true OR compensationStrategy=compensating-transaction\n  standard:   security=internal or partner AND availability=99.9 AND any async pattern\n  minimal:    security=internal AND availability=best-effort AND pattern=outbound-notification only\n  Write to: decisions.json scaffold.profile",

  "MuleSoft Anti-Patterns guard (check design against all 10 before finalizing architecture.md):\n  Shared Database integration — if present, flag and document specific justification.\n  Synchronous fan-out — replace with scatter-gather (I) or async fan-out (M).\n  Process Integration overuse — reserve orchestration (H) for true saga; EDA for autonomous consumers.\n  Polling without watermark — all scheduled-sync (D) flows MUST use watermark; write scheduling.watermarking=true.\n  Large payloads in MQ — enforce Claim Check above 1MB threshold.\n  DLQ as Invalid Message Channel — validate-first rule; structural failures go to invalid-messages-queue.\n  Fire-and-forget on critical mutations — MANUAL ack on all MQ consumers for financial/provisioning flows.\n  Correlating by payload field — always generate correlationId at gateway; never use payload field.\n  Inline complex DataWeave — external .dwl files for any transform > 10 lines.\n  Java class in DataWeave — flag and replace with DataWeave 2.0 native functions.",

  "MuleSoft Connector lookup — standards/connector-registry.json is the ONLY lookup:\n  If lastVerified > 30 days: call MuleSoft MCP search_asset, update lastVerified and lastVerifiedBy, then use.\n  Never look up the same connector twice.\n  Not found → classify REST (http connector) or SOAP (soap connector), add full entry to registry, commit.\n  Truly unknown → flag OPEN ITEM BLOCKER in architecture.md — do not produce decisions.json for that system.",

  "MuleSoft FIELD_KNOWLEDGE.md — check entries matching this project's systems or patterns BEFORE Level 1. Verified entries take precedence over scenario file defaults.",

  "MuleSoft FIELD_KNOWLEDGE.md write-back: after completing any MD run, add an FK-NNN observation entry for any finding that deviated from the standard scenario file prediction, revealed a non-obvious API contract pattern, or required an undocumented scaffold profile adjustment. Set status=observation.",

  "MuleSoft: Apply all standards defaults. Max 3 questions per run — only if blocking and no default applies.",
]

# MuleSoft-specific menu items added to Winston's standard menu.

[[agent.menu]]
code = "MD"
description = "Run MuleSoft architecture — walk 6-level decision tree, produce architecture.md + decisions.json"
prompt = """
Apply the MuleSoft BMAD Architect workflow from docs/PLANNING_CONTEXT.md.

Pre-flight:
- Confirm client folder (projects/{client}/) and that prd.md is present and NOT marked BLOCKED.
- Note any FIELD_KNOWLEDGE.md verified entries matching this project's systems or patterns.
  Verified entries OVERRIDE scenario file defaults — document which entries applied.

Walk the 6-level decision tree — enforce all rules; do not skip levels:

  Level 0 — Integration Style
    Apply selection rules (in order):
      Caller waits for sync response → RPC
      Decoupled/async/multi-consumer → Messaging
      File drop or large batch → File Transfer
      Legacy no-API shared DB only → Shared Database (flag anti-pattern; document justification)
      Multiple styles needed → Hybrid
    Write to: decisions.json integration.integrationStyle

  Level 1 — Primary Pattern (A–R)
    Read standards/scenarios/{pattern}.md for the candidate pattern — MANDATORY, not optional.
    Consult docs/PATTERNS_RESEARCH.md if choice is non-obvious or no scenario file clearly fits.
    If Messaging style: run the 6-question EDA Fit Assessment checklist from PLANNING_CONTEXT.md.
      Throughput >100K/day or consumers >10 → Kafka required (not Anypoint MQ).
      Consumer needs replay → Kafka required.
    If hybrid: populate decisions.json secondaryPatterns[] — cannot be empty.
    Write to: decisions.json integration.primaryPattern (and secondaryPatterns[] if hybrid)

  Level 2 — NFR Profile
    Volume, latency, frequency, availability, throughput.
    Write to: decisions.json nfr.*

  Level 3 — Systems and Connectors
    For each system in prd.md: check standards/connector-registry.json.
    If lastVerified > 30 days: call MuleSoft MCP search_asset, update entry, then use.
    If not found: classify REST or SOAP, add full entry to registry, commit.
    If truly unknown: flag OPEN ITEM BLOCKER — do not produce decisions.json until resolved.
    Write to: decisions.json systems.connectors[]

  Level 4 — Operational Needs (evaluate every item)
    TTL classification (MUST match event category — not always 24h):
      critical (orders/payments/provisioning) → messageTtlHours=168
      standard integration events → messageTtlHours=24
      notification events → messageTtlHours=1
      monitoring/audit events → messageTtlHours=72
      CDC events → messageTtlHours=4
    deduplicationTtlMinutes = messageTtlHours × 60 (always)
    scheduling.watermarking=true for all scheduled-sync (D) flows (persistent Object Store)
    Write to: decisions.json observability.*, notifications.*, scheduling.*, flowControl.*

  Level 5 — Security Level
    internal | partner | regulated | government
    Write to: decisions.json security.*

  Level 6 — Client-Facing Needs (multi-select)
    Write to: decisions.json clientFacing.*

Cross-cutting (evaluate ALL — none are optional):
  Idempotent Receiver → flowControl.deduplicationEnabled=true (all async flows)
  Claim Check → if any flow payload may exceed 1MB
  Normalizer → if N source formats for same entity
  Wire Tap → if profile=enterprise or regulated
  Invalid Message Channel → errorHandling.invalidMessageChannel=true when applicable
  Semantic Dissonance → document in architecture.md table when field names collide
  Anti-patterns → check all 10 from PLANNING_CONTEXT.md anti-patterns table

Compensation strategy per flow:
  financial/provisioning/compliance mutation → compensating-transaction
  idempotent + transient failure → retry
  cost of recovery > cost of loss → write-off
  Write to: decisions.json errorHandling.compensationStrategy

Scaffold profile (compute and write before done):
  regulated > enterprise > standard > minimal (first matching rule wins)
  Write to: decisions.json scaffold.profile

Output:
- Write complete decisions.json (validate against standards/decisions-schema.json)
- Write projects/{client}/architecture.md using templates/architecture-template.md structure:
    Per-flow sections: Field Mapping table + Business Rules + Open Items
    Semantic Dissonance table
    Cross-cutting Patterns Applied table
    EDA Fit Assessment (if Messaging style)
    Architect Sign-Off Checklist

After completing: add FK-NNN observation entry to docs/FIELD_KNOWLEDGE.md for any non-obvious finding.

Which client should I run architecture for?
"""

[[agent.menu]]
code = "CV"
description = "Verify connector versions — check registry staleness, call MCP for any > 30 days old, update registry"
prompt = """
Check standards/connector-registry.json for all connectors listed in projects/{client}/decisions.json systems.connectors[].

For each connector:
1. Read its lastVerified date from the registry.
2. If ≤ 30 days: mark as current. No action required.
3. If > 30 days: MUST call MuleSoft MCP search_asset to verify current version on Exchange.
   - Update registry entry: lastVerified=today, lastVerifiedBy=mcp-check, version if changed.
   - If version changed from what is in decisions.json: flag the discrepancy for developer review.
4. If > 6 months: also print scaffold staleness warning.

Report: connector | current version in registry | MCP-verified version | status (current/updated/discrepancy).
Commit registry updates: "registry: Verify {connector} versions via MCP [CV run]"

Which client's decisions.json should I check?
"""
