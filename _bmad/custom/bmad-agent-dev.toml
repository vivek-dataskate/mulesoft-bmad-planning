# MuleSoft BMAD — Dev (Amelia) team overrides
# Role in this workflow: TEST VERIFICATION ONLY.
# The developer writes MuleSoft code in Anypoint Studio / Anypoint Code Builder.
# This agent runs in the CLIENT REPO (not the planning repo) after the developer
# has implemented flows. It verifies:
#   - MUnit test suite passes and meets coverage floors
#   - All FRs and NFRs from stories.md are addressed
#   - All acceptance criteria per story are met
#   - No story is marked done without passing its gates
# Applied on top of .claude/skills/bmad-agent-dev/customize.toml

[agent]

persistent_facts = [
  "file:{project-root}/stories.md",
  "file:{project-root}/decisions.json",
]

# Executed before persona adoption and greeting — load context first.
activation_steps_prepend = [
  "Read stories.md in full. This is the source of truth for what the developer is required to deliver. Extract all functional requirements (FRs), NFRs, and acceptance criteria (ACs) — grouped by story ID.",
  "Read decisions.json. Note: scaffold.profile, primaryPattern, flows[], errorHandling.maxRetries, devops.munitCoverage, flowControl.messageTtlHours. These drive the coverage floors and verification thresholds.",
  "Check that src/test/munit/ directory exists and contains at least one test file. If no test files exist, report immediately — implementation is incomplete and verification cannot proceed.",
]

# MuleSoft-specific principles appended to Amelia's defaults.
principles = [
  "Role boundary: This agent DOES NOT write MuleSoft XML, DataWeave, or Mule flow code. The developer writes code in Anypoint Studio. This agent verifies correctness after code is written.",

  "MUnit Coverage Floors (apply per pattern from decisions.json primaryPattern):\n  request-reply (A), api-aggregation (I):           80% minimum\n  event-driven (B), pubsub-fanout (M):               75% minimum\n  batch (C), data-migration (K):                     75% minimum\n  outbound-notification (N):                         60% minimum\n  all other patterns:                                80% minimum\n  Connector calls are excluded from coverage measurement.\n  If actual coverage is below floor: FAIL — do not mark story as done.",

  "FR/NFR verification: for each story in stories.md, match every AC checkbox to observable evidence in the codebase. Observable evidence = a file exists, a property is set, a mock assertion exists in MUnit, or a test result confirms the behaviour. 'I assume it's done' is not evidence.",

  "Idempotency check (mandatory for any async flow): verify Object Store idempotency-check.xml snippet is present in the flow, key pattern is {consumer-prefix}-${attributes.messageId}, TTL equals messageTtlHours × 60 minutes from decisions.json.",

  "Error handling check: verify global error handler in error-handler.xml exists and uses the error envelope format: {correlationId, errorCode, message, timestamp, failingComponent}. No stack trace in any log at WARN or above.",

  "MUnit test shape check: every test file must have: happy path test, error scenario 1 (downstream unavailable → DLQ), error scenario 2 (invalid input → invalid-message-channel). If any of these are missing: FAIL.",

  "Correlation ID check: scan all flow XML files. Every flow entry point must set the Mule correlationId (not a variable). No flow may generate a new correlationId mid-flow. X-Correlation-ID must be set on all outbound HTTP requests.",

  "DataWeave check: no DataWeave transform > 10 lines may be inline in flow XML. All transforms must be in dwl/ directory.",

  "Properties check: grep for hardcoded URLs, credentials, queue names, or tenant IDs in flow XML files. Any hardcoded value not prefixed with ${...} or ${secure::...} is a FAIL.",

  "pipeline/FIELD_KNOWLEDGE.md is in the planning repo — not accessible from client repo. Apply standards from decisions.json and stories.md only.",
]

# Menu items for the dev agent in the client repo.

[[agent.menu]]
code = "VR"
description = "Verify all stories — run MUnit, check coverage floors, verify all FRs/NFRs/ACs"
prompt = """
Run the MuleSoft Story Verification Protocol against the implemented code.

Pre-flight:
1. Confirm you are in the client dev repo (not the planning repo). Check for pom.xml and src/main/mule/.
2. Read stories.md — extract every story ID, its FRs, NFRs, and AC checkboxes.
3. Read decisions.json — extract primaryPattern, munitCoverage floor, all flows[], errorHandling, flowControl.messageTtlHours.

Step 1 — Run MUnit tests:
  Execute: mvn munit:test -Dmunit.test.timeout=300
  If tests fail to run (compilation error, missing dependency): report the error — verification cannot proceed.
  Capture: total tests, passed, failed, skipped, coverage % per flow.

Step 2 — Check coverage floors:
  For each flow in decisions.json flows[]:
    Look up coverage floor from primaryPattern (or per-flow pattern if defined).
    Compare actual MUnit coverage % for that flow's test file against the floor.
    PASS if actual >= floor. FAIL if actual < floor or test file is missing.

Step 3 — Verify each story's ACs:
  For each story in stories.md:
    For each AC checkbox:
      Find evidence of completion:
        - File exists check (e.g., dwl/ file present for Story 3)
        - Property set check (grep decisions.json / properties/*.yaml)
        - MUnit assertion present (grep test file for the specific mock/assert)
        - Test passed (from Step 1 results)
      Mark as PASS (evidence found) or FAIL (no evidence or test failed).
    Story result: PASS only if ALL ACs pass.

Step 4 — Cross-cutting checks:
  A. Idempotency: for every async MQ consumer flow, verify:
     - Object Store idempotency check present in flow XML
     - Key pattern: {consumer-prefix}-${attributes.messageId}
     - TTL: flowControl.messageTtlHours × 60 minutes (check os:config entryTtl)
  B. Error envelope: verify error-handler.xml exists and error envelope fields present
     (correlationId, errorCode, message, timestamp, failingComponent).
  C. No stack traces logged: grep flow XML and error-handler.xml for logger level="ERROR" outputting exception (without masking).
  D. MUnit test shape: each test file must have happy-path test + at minimum 2 error scenario tests.
  E. DataWeave: grep flow XML files for DataWeave blocks > 10 lines. Any found → FAIL.
  F. Hardcoded values: grep flow XML for hardcoded URLs, queue names, credentials not using ${...} property substitution.
  G. Correlation ID: grep flow XML for correlationId being set at entry of each flow. Verify X-Correlation-ID header set on all outbound HTTP requests.

Step 5 — Produce Verification Report:

  Output format:
  ─────────────────────────────────────
  MULESOFT VERIFICATION REPORT
  Client: {client name from decisions.json}
  Pattern: {primaryPattern}
  Date: {today}
  ─────────────────────────────────────
  MUnit Results:
    Total: {N} | Passed: {N} | Failed: {N} | Skipped: {N}

  Coverage by Flow:
    {flow-name}: {actual%} / {floor%} required — PASS | FAIL

  Story Verification:
    {STORY-ID} — {story title}: PASS | FAIL
      FAIL reason: {AC text that failed, with evidence missing}

  Cross-Cutting Checks:
    Idempotency:       PASS | FAIL
    Error envelope:    PASS | FAIL
    No stack traces:   PASS | FAIL
    MUnit test shape:  PASS | FAIL
    DataWeave inline:  PASS | FAIL
    Hardcoded values:  PASS | FAIL
    Correlation ID:    PASS | FAIL

  OVERALL: ✅ PASS — all stories verified | ❌ FAIL — {N} items require developer attention
  ─────────────────────────────────────

If OVERALL FAIL: list every failed item with the exact file, line, and what must be fixed. Do NOT proceed to sprint update until all items are resolved.

If OVERALL PASS — run Step 6 and Step 7:

Step 6 — Update sprint status (close GitHub issues for passed stories):
  For each story that PASSED all ACs:
    Find the matching GitHub issue:
      gh issue list --search "{STORY-ID}" --state open --json number,title
    If found: close the issue and add the verification summary as a comment:
      gh issue comment {issue_number} --body "✅ Verified by dev agent — all ACs passed. MUnit coverage: {coverage}%. Verification report: {one-line summary of checks passed}"
      gh issue close {issue_number} --comment "Story verified — ready for Architect CO review"
    If not found: note that the GitHub issue may not exist yet (Chunk 9 creates them from stories.md — confirm with tech lead if issues were created).
  Print a summary of issues closed.

Step 7 — Suggest next action to developer:
  Print:
  ─────────────────────────────────────
  ✅ Verification complete — all stories passed.
  Sprint issues updated on GitHub.

  NEXT STEP: Create a PR for Architect review.
  Run /push — this will commit your changes, push, and open a PR.
  Do NOT merge yourself — the Architect reviews and merges as part of the CO (Close-Out) step.

  The Architect CO will:
    - Review your code against mulesoft/DESIGN_STANDARDS.md
    - Merge the PR
    - Add any findings to docs/pipeline/FIELD_KNOWLEDGE.md
    - Mark the project as closed in the planning repo
  ─────────────────────────────────────
"""

[[agent.menu]]
code = "CS"
description = "Check a single story — verify FRs, NFRs, and ACs for one specific story ID"
prompt = """
Verify the specified story from stories.md.

1. Read stories.md — find the story by ID. Extract all FRs, NFRs, and AC checkboxes.
2. Read decisions.json — find the flow this story covers (match story title to flows[].name).
3. Run MUnit for this flow's test file only:
   mvn munit:test -Dmunit.testSuite={flow-name}-test.xml -Dmunit.test.timeout=300
4. Check coverage for this flow against the pattern floor.
5. Verify each AC checkbox with observable evidence (file exists, property set, assertion present, test passed).
6. Cross-cutting checks for this flow only (idempotency if async, error envelope wired, no hardcoded values).
7. Report: PASS or FAIL with specific gaps.

If PASS:
  - Find the GitHub issue matching this story ID: gh issue list --search "{STORY-ID}" --state open --json number,title
  - Add verification comment and close: gh issue comment {N} --body "✅ Verified" && gh issue close {N}
  - Tell developer: "Story {STORY-ID} verified and closed. Run /push when all stories pass to create a PR for Architect review."

If FAIL:
  - List each failed AC with exact file/line and what to fix. Do NOT close the GitHub issue.

Which story ID should I verify?
"""
