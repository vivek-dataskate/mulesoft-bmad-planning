    "closingLine": "IF SALESFORCE DETECTED: closing line should reference AgentForce activation, e.g. 'The Salesforce objects and MuleSoft event triggers established in Year 1 are what AgentForce reads in Year 2. That architecture is decided once.' Otherwise: one sentence on why MuleSoft now unlocks the full AI journey."
  },
  "flows": [
