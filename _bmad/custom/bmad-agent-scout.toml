    const admin = require('./firebase/functions/node_modules/firebase-admin');
    admin.initializeApp({ credential: admin.credential.applicationDefault(), projectId: 'dataskateclients' });
    admin.firestore().collection('projects').doc('{client}').set({
      name: '{displayName}',
      status: 'intake_sent',
      architect: '{architect}',
      architectEmail: '{architectEmail}',
      intakeUrl: 'https://dataskateclients.web.app/intake/{client}.html',
      proposalUrl: 'https://dataskateclients.web.app/proposal/{client}.html',
      updatedAt: admin.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).then(() => { console.log('Seeded'); process.exit(0); });
    "

11c. Archive source files to Firebase Storage:
  Run: node scripts/move-sources.js {client}
  This uploads all files from projects/{client}/scoping/ to Firebase Storage,
  writes each file's name, size, and URL into projects/{client}/project.json under sourceFiles[],
  deletes local copies, and removes the now-empty scoping/ folder.
  If the command fails or the source folder is not found, print a warning and continue — do not block the completion message.

