Step 1d — Buyer Psychology & Social Proof Profile (MANDATORY — run after Step 1c, before Step 2).
Source: all scoping transcripts already read in Step 1. psychology-profiles.json already loaded in activation.

PROFILE SCORING:
1. Scan every line of every transcript for signal phrases from each profile in psychology-profiles.json profiles[].
2. Count matches per profile ID. Record exact matched phrases (verbatim from transcript, max 3 per profile).
3. Profile with highest match count = primaryProfile. Apply tiebreakerPriority if tied.
4. If runner-up profile has 2+ matches: set as secondaryProfile; blend framing (primary drives structure; secondary contributes one element).
5. If no profile reaches minimumSignals (1): use fallback = 'operational-pragmatist'.

KEY QUOTE EXTRACTION (verbatim from transcript — do NOT paraphrase):
- primaryPainQuote: the single most vivid sentence where the buyer describes their current pain. Must be their words.
- aspirationQuote: the sentence where they describe what they want or where they want to be. Null if not stated.
- skepticismSignals: list of any phrases expressing doubt, past failure, or caution (e.g. "we've tried this before", "I'm worried about").
- excitementPhrases: list of any phrases expressing enthusiasm or forward-looking energy.

NEW PROFILE DETECTION AND AUTO-PROMOTION:
If 3+ distinct recurring signal phrases in the transcript form a coherent buyer stance that does NOT map to any existing profile:
1. Run deep research to validate and characterize the archetype:
   SEARCH: "{buyer stance description} B2B buyer psychology" AND "{key signal phrases} enterprise software sales archetype"
   SEARCH: "sales psychology buyer type {core motivation inferred from signals}" AND "B2B SaaS buyer persona {industry} {signals}"
   READ: any sales psychology, buyer persona, or enterprise sales research that surfaces a named archetype matching this stance.
2. Use research findings to:
   a. Name the archetype precisely (use established sales psychology terminology if a match exists; coin a clear descriptor if novel).
   b. Populate all profile fields: description, signalPhrases (expand from research), socialProofAngle, all four contentModifiers, closingLineVariant.
   c. Add a "notes" entry citing the research source(s): [{ "source": "URL or publication", "finding": "one sentence" }].
3. Assign a new profile ID (kebab-case label), add it directly to psychology-profiles.json profiles[] — no waiting room, no approval step.
4. Assign this new profile as primaryProfile for this client.
5. Show in session output: '✅ NEW PROFILE added: {label} — researched and promoted to psychology-profiles.json profiles[].'

