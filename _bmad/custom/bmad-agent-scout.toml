ms\": [\"...\"] },\n      \"closingLine\": \"verbatim closing line from proposal-structure.md\"\n    },\n    \"flows\": [\n      { \"num\": 1, \"name\": \"...\", \"route\": \"A → MuleSoft → B\", \"complexity\": \"high|medium|low\", \"value\": \"1-2 sentence business value\" }\n    ],\n    \"outcomes\": [\n      { \"icon\": \"⚡\", \"title\": \"...\", \"body\": \"...\" }\n      /* 3 cards; last must be AI-Ready Foundation verbatim from proposal-structure.md */\n    ],\n    \"roi\": null,\n    \"timeline\": [\n      { \"phase\": \"Phase 1\", \"weeks\": \"Weeks 1–N\", \"title\": \"...\", \"body\": \"...\" }\n    ],\n    \"pricing\": {\n      \"timelineWeeks\": N,\n      \"period1\": { \"rate\": \"825\" },\n      \"period2\": { \"rate\": \"700\" },\n      \"period3\": { \"rate\": \"600\" },\n      \"period4\": { \"rate\": \"500\" },\n      \"implOnly\": \"NNNNN\"\n    },\n    \"included\": [\n      { \"title\": \"...\", \"detail\": \"...\" }\n      /* 6 items */\n    ],\n    \"about\": null,\n    \"oos\": [\n      { \"title\": \"...\", \"detail\": \"...\" }\n      /* 4+ items, client-specific */\n    ],\n    \"assumptions\": [\n      { \"assumption\": \"...\", \"owner\": \"client|ds|both|vendor\", \"when\": \"...\", \"p0\": true|false }\n    ],\n    \"nextSteps\": [\n      { \"title\": \"...\", \"body\": \"...\" }\n      /* 4 steps */\n    ]\n  }\n\n  PRICING RULES (from proposal-structure.md and pricing-model.md):\n  - Timeline: Weeks = 2 + (N × 1.5), round up\n  - Period rates come from pricing-model.md\n  - implOnly: compute from pricing-model.md for N flows\n  - about: null unless ae.isNewToDataSkate = true (from scout-s2.md HTML Generation Context)",
