  ],
  "fomo": [
    {
      "name": "use competitorFOMO[].displayName — real name only when sourceUrl exists, otherwise anonymized",
      "revenue": "$Xm ARR or revenue range",
      "relevanceTier": "exact-match | same-industry | adjacent-industry | industry-stat",
      "savings": "$X saved or X% or Xhrs/week recovered",
