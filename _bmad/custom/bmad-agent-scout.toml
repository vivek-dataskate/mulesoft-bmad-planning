PSYCHOLOGY-ADAPTED FRAMING: the integration deck is AE-facing (the architect pitches it). Apply psychologyProfile to the peer comparison slide and the AI journey narrative slide:
  - Peer comparison slide: use socialProofAngle to order and frame the FOMO entries (same rules as Step 3c fomo[]).
  - AI journey narrative: use journeyFraming to weight stage emphasis — Stage 3 heavy for visionary-strategic, Stage 1 outcomes-first for operational-pragmatist, peer references for peer-pressure.
  - Talking point for AE: generate one sentence per profile that the AE can say verbatim when presenting: 'For a {primaryProfileLabel} buyer, lead with: {fomoFraming first sentence}.'
