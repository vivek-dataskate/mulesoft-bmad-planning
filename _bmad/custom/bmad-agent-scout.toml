Step 3c — Generate discovery proposal (vision-only, no pricing).
Source: company_context.json (confirmedFlows, aiJourney, competitorFOMO, snapshot) + project.json (architect, architectEmail, displayName).

PROPOSAL AUTHENTICITY RULES — enforced on every field, no exceptions:
1. ZERO hallucination. Every fact, metric, system name, and workflow description must come directly from company_context.json or the scoping transcript. If a detail was not said in the scoping session, it does not appear in the proposal. Do not infer, extrapolate, or fill gaps with plausible-sounding content.
2. Use the client's exact language. If they said "the April procurement window," write "April procurement window." If they said "re-keying," write "re-keying." Their words, not your paraphrase.
3. Name actual people, systems, and processes from scoping. "Finance team manually reconciles HubSpot and NetSuite" is right. "Your team spends time on manual tasks" is not.
4. Banned phrases — never write these, in any section: "leverage AI," "data-driven," "unlock insights," "seamless integration," "digital transformation," "empower your team," "best-in-class," "cutting-edge," "AI-powered," "data contracts" (in client-facing sections), "future-proof," "scalable solution," "single source of truth," "end-to-end visibility."
5. If you do not have a specific fact for a field, write null — do not generate a plausible substitute.
6. A client who reads this proposal should recognize their own business in every sentence. If they would read a sentence and think "this could be any company," rewrite it.

PSYCHOLOGY-ADAPTED CONTENT RULES — apply BEFORE writing a single field in proposal-content.json:
Read company_context.json.psychologyProfile. Every client-facing field in the JSON is adapted through this lens.

1. challenge.lead — anchor in primaryPainQuote (use their verbatim words as the emotional hook). Apply contentModifiers.challengeFraming as the framing structure. If skepticismSignals are present: acknowledge the friction first — do not open with the solution.

2. fomo[] ordering — reorder competitorFOMO entries using socialProofAngle:
   'quantified-savings'  → sort by savings figure (largest first)
   'peer-comparison'     → sort by relevanceTier (exact-match first), then by name proximity (same city > same state > national)
   'proven-pattern'      → sort by whatTheyBuilt similarity to this client's use case
   'first-mover'         → sort by aiUseCase specificity (most concrete AI action first)
   'time-saved'          → sort by hours/people recovered (largest first)
   Apply contentModifiers.fomoFraming as the lens for each fomo[].fomoAngle field — rewrite if the verbatim fomoAngle from company_context.json does not lead with the right hook for this profile.

3. journey section writing — apply contentModifiers.journeyFraming as the structural guide for all three stages. The journeyFraming tells you where to put the emphasis (Stage 1 heavy for operational-pragmatist, Stage 3 heavy for visionary-strategic, peer references for peer-pressure, etc.).

4. journey.closingLine — use contentModifiers.closingLineVariant INSTEAD of the default from proposal-structure.md, unless closingLineVariant is null (then fall back to the proposal-structure.md default).

5. If aspirationQuote is not null — weave it into journey.headline as a callback to the client's own stated destination. Frame as: 'the path to [their aspiration, in their words].'

6. If secondaryProfile is not null — blend one element from the secondary profile into the structure (e.g. if primary=operational-pragmatist and secondary=roi-analytical: Stage 1 bullet items read like a 'stops happening' list, but challenge.lead includes a cost anchor from the transcript).

SELF-CHECK: before writing the JSON, read every sentence and ask: 'Would a {primaryProfileLabel} buyer stop and nod at this?' If not, rewrite it through that profile's lens.
→ LOG to decisions.json after writing proposal-content.json: one content-adaptation entry per field that was reframed by the psychology profile (challenge.lead, fomo ordering, journey.closingLine variant, any fomoAngle rewrite). For each: what the default would have been, what changed, and which profile modifier drove it.

