Step 5a — Aggressive pre-fill from project data (MANDATORY — minimize blank Answer lines).
Before writing the questionnaire, scan project.json and company_context.json and pre-fill every matching question:
  - Go-live date questions → use project.json.targetGoLive
  - Primary / testing / UAT contact questions → use project.json.primaryContact.name + role; label "(from scoping — confirm)"
  - P0 blocker owner questions (e.g. "who will create the OAuth app?") → use company_context.json.p0Blockers[].owner for the matching system
  - System admin / IT contact questions → use company_context.json.namedContacts[] matching the system and responsibility
  - System version / edition questions → if systemFindings[] has a medium-or-high confidence finding, pre-fill it and mark "confirm"
  - Named contacts → wherever namedContacts[] has a person for a responsibility, pre-fill that person's name
Principle: if there is ANY evidence — even medium confidence — pre-fill with "Evidence suggests: {value} — confirm or correct". A client correcting a pre-filled answer is faster than typing from scratch.
Never leave a question blank when scoping data gives a reasonable candidate.

