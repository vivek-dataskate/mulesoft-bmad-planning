FOMO rules: take the top 2–4 entries from company_context.json competitorFOMO[] ordered by relevanceTier (exact-match first, then same-industry, then adjacent-industry). Geo-proximity within 100 miles takes priority within the same tier — a nearby same-industry company beats a national same-industry company. If competitorFOMO is empty, set "fomo": [].
NAMING RULE (enforced here, not in template): use competitorFOMO[].displayName for the "name" field. A real company name appears ONLY when competitorFOMO[].sourceUrl is a real public URL — the client can click it and verify the claim. If no sourceUrl, use the anonymized displayName. Pass sourceUrl, sourceLabel, and aiAgentDescription through verbatim; fill-template.js renders the company name as a clickable link when sourceUrl is present and shows the AI agent description as a highlighted inline callout.
fomoThoughtStarters rules: copy company_context.json.aiThoughtStarters[] verbatim. These render at the bottom of the Peer Comparison section as a "thought starters" list. Do NOT invent new entries — only pass through what was generated in Step 0c-3.
flows: derive from confirmedFlows[] — use entity + direction for name and route; value = 1–2 sentence business outcome (NOT technical detail); no complexity field.
Then run: node commons/branding/fill-template.js --template proposal --client {client}
