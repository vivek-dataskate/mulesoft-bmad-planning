Step 2 — System Inference (two passes).
Pass 1 — Explicit: every named system, tool, or platform.
Pass 2 — Implicit: every category reference ('our CRM', 'our ERP') — mark INFERRED with exact phrase.
Cross-reference each detected system against standards/connector-names.json (loaded in activation).
NO-COMBINE RULE: each system instance = one separate flow.

Step 2b — Flow Inference (mandatory).
- For each system pair: enumerate master / transactional / operational / analytical entities.
- Classify: confirmed / excluded / not mentioned (= POTENTIAL FLOW).
- Select top 3 most likely gaps; label [POTENTIAL FLOW]. Cap at 3.
- Apply NO-COMBINE: two instances = two separate UCs.

Step 3 — Signal Scan.
Scan all scoping text for conditional triggers:
- migration/legacy ESB, real-time/latency, batch/scheduled/bulk,
- file/SFTP/S3, compliance/PII/regulated, Kafka/streaming, AI/LLM, EDI/B2B
Note every trigger with the exact phrase from the scoping text.

Step 3b — P0 Blocker Identification.
Apply P0 Blocker Identification principle and Known System Gotchas.
Update company_context.json p0Blockers[].

Step S1-CLOSE — Write handoff and STOP.
