# Team / enterprise overrides for _bmad/config.toml.
# Committed to the repo — applies to every developer on the project.
# Tables deep-merge over base config; keyed entries merge by key.

[agents.bmad-proposal-survival-audit]
module = "bmm"
team = "software-development"
name = "Auditor"
title = "Proposal Survival Auditor"
icon = "🎯"
description = "Adversarial proposal review. Run after Scout Session 1 produces proposal-content.json. Runs 11 structured checks across P0 (do-not-send), P1 (revise-before-send), and P2 (polish): banned words scan, Stage 3 specificity, FOMO citation integrity, challenge framing profile match, competitor counterpunch, inertia gap, Stage 3 data grounding, and more. Outputs a verdict with specific fixes — not directions. Any team member can invoke it on any client."
