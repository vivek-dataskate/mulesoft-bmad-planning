<!-- DataSkate Proposal — Canonical CSS
     Implements commons/branding/HTML_DESIGN_STANDARDS.md
     Paste this block verbatim into <head> of every proposal HTML.
     Do NOT modify colors or class names. Extend by adding new classes only. -->
<style>
/* ── PALETTE (HTML_DESIGN_STANDARDS.md §Color Palette) ── */
:root {
  --brand:    #ed1c24;
  --brand-dk: #a01019;
  --dark:     #1A1A1A;
  --mid:      #555F6E;
  --light:    #FFF5F5;
  --border:   #E8E0E0;
  --green:    #2E9E6B;
  --amber:    #D69E2E;
  --amber-bg: #FFFBEB;
  --blue-bg:  #F0F6FF;
  --blue-br:  #3B82F6;
}

/* ── BASE (HTML_DESIGN_STANDARDS.md §Typography + §Page Layout) ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--dark);
  background: #fff;
  max-width: 900px;
  margin: 0 auto;
  padding: 0 0 80px;
}
h4 { font-size: 15px; font-weight: 700; color: var(--dark); }
p { color: #44546A; margin-bottom: 14px; line-height: 1.65; }
p:last-child { margin-bottom: 0; }
p strong, li strong { color: var(--dark); font-weight: 700; }
.lead { font-size: 16px; color: var(--dark); font-weight: 400; line-height: 1.7; margin-bottom: 24px; }
.pull-quote {
  border-left: 4px solid var(--brand);
  background: var(--light);
  padding: 14px 20px;
  border-radius: 0 8px 8px 0;
  margin: 20px 0;
  font-size: 15px; font-weight: 600; color: var(--dark); line-height: 1.5;
}

/* ── HEADER (HTML_DESIGN_STANDARDS.md §Header Component) ── */
.header {
  background: #fff;
  border-bottom: 3px solid var(--brand);
  padding: 36px 56px 32px;
}
.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.header .eyebrow {
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--mid);
}
.header-title-block {
  border-left: 4px solid var(--brand);
  padding-left: 20px;
  margin-bottom: 28px;
}
.header h1 {
  font-size: 32px; font-weight: 800; line-height: 1.2;
  margin-bottom: 8px; color: var(--dark);
}
.header .subtitle { font-size: 15px; color: var(--mid); line-height: 1.6; max-width: 620px; }
.header-meta {
  display: flex; gap: 0; font-size: 13px;
  border-top: 1px solid var(--border); padding-top: 20px; flex-wrap: wrap;
}
.header-meta span {
  color: var(--mid); padding-right: 28px; margin-right: 28px;
  border-right: 1px solid var(--border); line-height: 1.5;
}
.header-meta span:last-child { border-right: none; margin-right: 0; }
.header-meta span strong {
  color: var(--dark); font-weight: 600; display: block;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
}

/* ── SECTIONS (HTML_DESIGN_STANDARDS.md §Section Headers) ── */
section { padding: 48px 56px; border-bottom: 1px solid var(--border); }
section:last-child { border-bottom: none; }
h2 {
  font-size: 11px; font-weight: 700; letter-spacing: 2.5px;
  text-transform: uppercase; color: var(--brand); margin-bottom: 6px;
  display: flex; align-items: center; gap: 10px;
}
h2::before {
  content: ''; display: inline-block; width: 18px; height: 2px;
  background: var(--brand); flex-shrink: 0; border-radius: 2px;
}
h3 { font-size: 22px; font-weight: 700; color: var(--dark); margin-bottom: 12px; line-height: 1.25; }

/* ── CHALLENGE ── */
.challenge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
.challenge-card {
  background: var(--light); border-left: 3px solid var(--brand);
  border-radius: 6px; padding: 16px 20px;
}
.challenge-card .label {
  font-size: 11px; font-weight: 700; color: var(--brand);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
}
.challenge-card p { font-size: 14px; color: var(--dark); margin: 0; }

/* ── SOLUTION DIAGRAM ── */
.diagram {
  background: var(--light); border: 1px solid var(--border);
  border-radius: 10px; padding: 32px; text-align: center; margin: 8px 0 24px;
}
.diagram-label { font-size: 11px; color: var(--mid); margin-top: 20px; font-style: italic; }

/* ── JOURNEY / STAGES (HTML_DESIGN_STANDARDS.md — stage colors from proposal-structure.md) ── */
.stage-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin: 8px 0 16px; }
.stage-card { border-radius: 10px; padding: 24px 20px; }
.stage-card.stage1 { background: #FFF0F0; border-top: 4px solid var(--brand); }
.stage-card.stage2 { background: #F0FFF6; border-top: 4px solid var(--green); }
.stage-card.stage3 { background: #F2F4F8; border-top: 4px solid #1C2B3A; }
.stage-card .stage-label {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; margin-bottom: 4px;
}
.stage-card.stage1 .stage-label { color: var(--brand); }
.stage-card.stage2 .stage-label { color: var(--green); }
.stage-card.stage3 .stage-label { color: #1C2B3A; }
.stage-card .stage-year { font-size: 11px; color: var(--mid); margin-bottom: 10px; }
.stage-card h4 { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 10px; }
.stage-card ul { list-style: none; padding: 0; margin: 0; }
.stage-card ul li {
  font-size: 13px; color: #44546A; padding: 4px 0 4px 18px;
  position: relative; line-height: 1.5;
}
.stage-card ul li::before { content: '→'; position: absolute; left: 0; color: var(--brand); font-size: 11px; top: 5px; }
.stage-card.stage2 ul li::before { color: var(--green); }
.stage-card.stage3 ul li::before { color: #1C2B3A; }
.stage-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 3px 10px; border-radius: 20px; margin-bottom: 10px;
}
.stage-badge.current { background: var(--brand); color: #fff; }
.stage-badge.next    { background: #E8E8E8; color: var(--mid); }

/* ── FLOW CARDS ── */
.flow-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.flow-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 16px 20px; background: #fff;
}
.flow-card .flow-num {
  font-size: 10px; font-weight: 700; color: var(--brand);
  text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 4px;
}
.flow-card .flow-name { font-size: 14px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
.flow-card .flow-route { font-size: 12px; color: var(--mid); margin-bottom: 6px; }
.flow-card .flow-value { font-size: 13px; color: #44546A; line-height: 1.6; }

/* ── COMPLEXITY BADGES (HTML_DESIGN_STANDARDS.md §Badges) ── */
.complexity-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px; float: right; margin-top: 2px;
}
.complexity-badge.high   { background: #FEF3C7; color: #92400E; }
.complexity-badge.medium { background: #EBEBEB; color: var(--mid); }
.complexity-badge.low    { background: #D1FAE5; color: #065F46; }

/* ── OUTCOMES ── */
.outcomes-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.outcome-card {
  background: var(--light); border-radius: 10px; padding: 24px 20px; text-align: center;
}
.outcome-icon { font-size: 28px; margin-bottom: 10px; }
.outcome-card h4 { font-size: 15px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
.outcome-card p  { font-size: 13px; color: #44546A; margin: 0; }

/* ── TIMELINE ── */
.timeline { position: relative; margin: 8px 0; }
.timeline::before {
  content: ''; position: absolute; left: 28px; top: 0; bottom: 0;
  width: 2px; background: var(--border);
}
.tl-item { display: flex; gap: 20px; padding: 0 0 28px; position: relative; }
.tl-dot {
  flex-shrink: 0; width: 58px; height: 58px;
  background: var(--brand); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700;
  text-align: center; line-height: 1.2; z-index: 1;
  box-shadow: 0 0 0 4px #fff;
}
.tl-dot.phase2 { background: var(--brand-dk); }
.tl-dot.phase3 { background: var(--green); }
.tl-content { padding-top: 12px; }
.tl-content h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.tl-content p  { font-size: 13px; color: var(--mid); margin: 0; }
.tl-weeks {
  font-size: 11px; font-weight: 700; color: var(--brand);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
}

/* ── INVESTMENT ── */
.model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
.model-card {
  border: 2px solid var(--border); border-radius: 12px;
  padding: 28px 22px; position: relative; background: #fff;
}
.model-card.recommended {
  border-color: var(--brand);
  box-shadow: 0 4px 20px rgba(237,28,36,0.14);
}
.model-card .rec-badge {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  background: var(--brand); color: #fff; font-size: 10px; font-weight: 700;
  letter-spacing: 1.5px; text-transform: uppercase;
  padding: 4px 14px; border-radius: 20px; white-space: nowrap;
}
.model-card .model-name {
  font-size: 13px; font-weight: 700; color: var(--mid);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
}
.model-card .model-impl {
  font-size: 28px; font-weight: 800; color: var(--dark); line-height: 1; margin-bottom: 2px;
}
.model-card .model-impl-label { font-size: 12px; color: var(--mid); margin-bottom: 16px; }
.model-card .model-service { font-size: 14px; font-weight: 600; color: var(--brand); margin-bottom: 2px; }
.model-card .model-service-label { font-size: 12px; color: var(--mid); margin-bottom: 16px; }
.model-card .model-divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.model-card .model-vp { font-size: 13px; color: var(--mid); line-height: 1.5; }
.model-card .best-for {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: var(--mid); margin-bottom: 4px; margin-top: 12px;
}
.managed-intro { margin: 32px 0 16px; }
.managed-intro h3 { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 6px; }
.managed-intro p  { font-size: 14px; color: var(--mid); margin: 0; }
.managed-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.managed-table th {
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--mid);
  border-bottom: 2px solid var(--border); padding: 8px 12px;
}
.managed-table td { padding: 12px; border-bottom: 1px solid var(--border); color: var(--dark); }
.managed-table tr:last-child td { border-bottom: none; font-weight: 700; background: var(--light); }
.managed-table td:last-child { text-align: right; font-weight: 600; }

/* ── WHAT'S INCLUDED ── */
.included-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.included-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 16px; background: var(--light); border-radius: 8px;
}
.included-item .check { color: var(--green); font-size: 16px; flex-shrink: 0; margin-top: 1px; }
.included-item .text { font-size: 13px; color: var(--dark); }
.included-item .text strong { display: block; font-weight: 600; font-size: 13px; margin-bottom: 1px; }
.included-item .text span  { color: var(--mid); font-size: 12px; }

/* ── OUT OF SCOPE ── */
.oos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.oos-item {
  display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px;
  background: #FFF5F5; border: 1px solid #FED7D7; border-radius: 8px;
}
.oos-item .x-mark { color: var(--brand); font-size: 14px; flex-shrink: 0; margin-top: 1px; }
.oos-item .text { font-size: 13px; color: var(--dark); }
.oos-item .text strong { display: block; font-weight: 600; font-size: 13px; margin-bottom: 1px; }
.oos-item .text span { color: var(--mid); font-size: 12px; }

/* ── ASSUMPTIONS TABLE (HTML_DESIGN_STANDARDS.md §Badges — owner-badge) ── */
.assumption-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.assumption-table th {
  text-align: left; font-size: 11px; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--mid);
  border-bottom: 2px solid var(--border); padding: 10px 14px; background: var(--light);
}
.assumption-table td {
  padding: 12px 14px; border-bottom: 1px solid var(--border);
  vertical-align: top; font-size: 13px;
}
.assumption-table tr:last-child td { border-bottom: none; }
.owner-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 1px; text-transform: uppercase;
  padding: 2px 8px; border-radius: 12px;
}
.owner-client { background: var(--light);    color: var(--brand-dk); }
.owner-ds     { background: #D1FAE5;          color: #065F46; }
.owner-both   { background: var(--amber-bg);  color: #7C5E10; }
.owner-vendor { background: #FEF3C7;          color: #92400E; }
.p0-flag {
  display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: 0.5px;
  text-transform: uppercase; padding: 1px 6px; border-radius: 4px;
  background: #FEE2E2; color: #991B1B; margin-right: 6px; vertical-align: middle;
}

/* ── ABOUT ── */
.about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-top: 8px; }
.credential-list { list-style: none; padding: 0; margin: 12px 0 0; }
.credential-list li {
  font-size: 13px; color: var(--mid); padding: 4px 0 4px 20px; position: relative;
}
.credential-list li::before {
  content: '→'; position: absolute; left: 0; color: var(--brand); font-size: 12px;
}

/* ── NEXT STEPS ── */
.next-steps { display: flex; gap: 0; }
.ns-item { flex: 1; text-align: center; padding: 0 16px; position: relative; }
.ns-item:not(:last-child)::after {
  content: '→'; position: absolute; right: -8px; top: 24px;
  font-size: 20px; color: var(--border);
}
.ns-num {
  width: 48px; height: 48px; background: var(--brand); color: #fff;
  border-radius: 50%; font-size: 18px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;
}
.ns-item h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.ns-item p  { font-size: 12px; color: var(--mid); margin: 0; }

/* ── FOOTER ── */
.footer {
  background: var(--dark); color: rgba(255,255,255,0.5);
  padding: 28px 56px; font-size: 12px;
  display: flex; justify-content: space-between; align-items: center;
  border-top: 3px solid var(--brand);
}
.footer strong { color: rgba(255,255,255,0.9); }
.footer a { color: rgba(255,255,255,0.5); text-decoration: none; }

/* ── PRINT (HTML_DESIGN_STANDARDS.md §Print / PDF Stylesheet) ── */
@media print {
  body { max-width: 100%; padding: 0; font-size: 11px; }
  .no-print { display: none !important; }
  .header { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  section { page-break-inside: avoid; }
  .p0-flag, .complexity-badge, .owner-badge {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
}
</style>
