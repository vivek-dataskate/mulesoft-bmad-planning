<style>
:root {
  --brand:    #ed1c24;
  --brand-dk: #a01019;
  --dark:     #1A1A1A;
  --mid:      #555F6E;
  --light:    #FFF5F5;
  --border:   #E8E0E0;
  --green:    #2E9E6B;
  --amber:    #D69E2E;
  --amber-bg: #FFFBEB;
  --blue-bg:  #F0F6FF;
  --blue-br:  #3B82F6;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.7;
  color: var(--dark);
  background: #fff;
  max-width: 820px;
  margin: 40px auto;
  padding: 0 32px 80px;
}

.doc-header {
  padding-bottom: 16px;
  border-bottom: 3px solid var(--brand);
  margin-bottom: 32px;
}

.eyebrow {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--mid);
  margin-top: 10px;
  margin-bottom: 4px;
}

h1 { font-size: 24px; font-weight: 800; color: var(--dark); margin-bottom: 4px; }

.resource-body h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--brand-dk);
  margin: 40px 0 10px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--border);
}

.resource-body h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--dark);
  margin: 26px 0 8px;
}

.resource-body h4 {
  font-size: 13px;
  font-weight: 700;
  color: var(--mid);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin: 20px 0 6px;
}

.resource-body p { margin: 10px 0; }
.resource-body > *:first-child { margin-top: 0; }

.resource-body ul,
.resource-body ol {
  margin: 10px 0 10px 22px;
}
.resource-body ul li { list-style: disc; margin: 4px 0; }
.resource-body ol li { list-style: decimal; margin: 4px 0; }

.resource-body blockquote {
  margin: 16px 0;
  padding: 12px 18px;
  border-left: 3px solid var(--brand);
  background: var(--light);
  font-style: italic;
  color: var(--dark);
  border-radius: 0 4px 4px 0;
}
.resource-body blockquote p { margin: 0; }

.resource-body pre.code-block {
  background: #1C1C1E;
  color: #E5E5EA;
  padding: 18px 20px;
  border-radius: 6px;
  font-size: 13px;
  font-family: 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace;
  line-height: 1.6;
  margin: 16px 0;
  overflow-x: auto;
  white-space: pre-wrap;
}

.resource-body code {
  background: #F2F2F4;
  padding: 2px 5px;
  border-radius: 3px;
  font-size: 13px;
  font-family: 'SF Mono', 'Fira Code', Consolas, 'Courier New', monospace;
  color: var(--brand-dk);
}

.resource-body pre.code-block code {
  background: none;
  padding: 0;
  color: inherit;
  font-size: inherit;
  border-radius: 0;
}

.resource-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 28px 0;
}

.md-table {
  width: 100%;
  border-collapse: collapse;
  margin: 16px 0;
  font-size: 14px;
}

.md-table th {
  background: var(--dark);
  color: #fff;
  padding: 9px 14px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
}

.md-table th:first-child { border-radius: 4px 0 0 0; }
.md-table th:last-child  { border-radius: 0 4px 0 0; }

.md-table td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

.md-table tr:nth-child(even) td { background: #FAFAFA; }
.md-table tr:last-child td { border-bottom: 2px solid var(--border); }

a { color: var(--brand); }
strong { font-weight: 700; }
em { font-style: italic; }
</style>
