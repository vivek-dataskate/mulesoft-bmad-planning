<!-- DataSkate Intake Questionnaire — Canonical CSS
     Implements commons/branding/HTML_DESIGN_STANDARDS.md
     Paste this block verbatim into <head> of every intake HTML.
     Do NOT modify colors or class names. Extend by adding new classes only. -->
<style>
/* ── PALETTE (HTML_DESIGN_STANDARDS.md §Color Palette) ── */
:root {
  --brand:    #ed1c24;
  --brand-dk: #a01019;
  --dark:     #1A1A1A;
  --mid:      #555F6E;
  --light:    #FFF5F5;
  --border:   #E8E0E0;
  --green:    #2E9E6B;
  --amber:    #D69E2E;
  --amber-bg: #FFFBEB;
  --blue-bg:  #F0F6FF;
  --blue-br:  #3B82F6;
}

/* ── BASE (HTML_DESIGN_STANDARDS.md §Typography + §Page Layout) ── */
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--dark);
  background: #fff;
}
a { color: var(--brand); }

/* ── LAYOUT ── */
.wrap { max-width: 900px; margin: 0 auto; padding: 0 56px 80px; }

/* ── STICKY ACTION BAR (HTML_DESIGN_STANDARDS.md §Sticky Action Bar) ── */
.sticky-bar {
  position: sticky; top: 0; z-index: 200;
  background: rgba(255,255,255,0.97);
  backdrop-filter: blur(4px);
  border-bottom: 1px solid var(--border);
  padding: 10px 56px;
  display: flex; align-items: center; justify-content: space-between;
}
.progress-pill { font-size: 12px; font-weight: 600; color: var(--mid); }
.progress-pill span { color: var(--brand); font-weight: 800; }
.bar-actions { display: flex; gap: 8px; }

/* ── BUTTONS (HTML_DESIGN_STANDARDS.md §Buttons) ── */
.btn {
  padding: 7px 16px; border-radius: 6px;
  font-size: 13px; font-weight: 700;
  cursor: pointer; border: none;
}
.btn-primary { background: var(--brand); color: #fff; }
.btn-outline  { background: #fff; color: var(--dark); border: 2px solid var(--border); }

/* ── BOTTOM SUBMIT BLOCK ── */
.submit-block { text-align: center; padding: 40px 0 20px; }
.btn-submit   { font-size: 15px; padding: 12px 36px; }
.submit-success {
  display: none;
  background: #F0FFF4;
  border: 1px solid #68D391;
  border-left: 4px solid var(--green);
  border-radius: 6px;
  padding: 14px 20px; margin-top: 16px;
  font-size: 14px; font-weight: 600; color: #276749;
}

/* ── HEADER (HTML_DESIGN_STANDARDS.md §Header Component — intake variant) ── */
.doc-header {
  padding: 36px 0 32px;
  border-bottom: 3px solid var(--brand);
}
.doc-header .eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: var(--mid); margin-bottom: 10px;
}
.doc-header h1 {
  font-size: 26px; font-weight: 800; color: var(--dark);
  margin-bottom: 6px; line-height: 1.25;
  border-left: 4px solid var(--brand); padding-left: 18px;
}
.doc-header .subtitle {
  font-size: 14px; color: var(--mid); margin-bottom: 20px; padding-left: 22px;
}
.doc-header .meta-row {
  display: flex; flex-wrap: wrap; gap: 0; font-size: 12px; padding-top: 16px;
}
.doc-header .meta-row span {
  color: var(--mid); padding-right: 28px; margin-right: 28px;
  border-right: 1px solid var(--border); line-height: 1.5;
}
.doc-header .meta-row span:last-child { border-right: none; margin-right: 0; }
.doc-header .meta-row span strong {
  color: var(--dark); font-weight: 600; display: block;
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px;
}

/* ── BUSINESS CONTEXT PANEL (HTML_DESIGN_STANDARDS.md §Business Context Panel) ── */
.biz-context {
  background: var(--light);
  border: 1px solid var(--border);
  border-left: 4px solid var(--brand);
  border-radius: 8px;
  margin: 32px 0 0;
  overflow: hidden;
}
.bc-header {
  background: #FFE4E4;
  padding: 12px 20px;
  cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  user-select: none;
}
.bc-title {
  font-size: 13px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--brand-dk);
}
.bc-chevron { font-size: 14px; color: var(--brand-dk); transition: transform 0.2s; }
.bc-body    { padding: 24px 28px; }
.bc-snapshot {
  font-size: 14px; color: var(--dark); margin-bottom: 16px; line-height: 1.7;
}

/* AI Journey cards (HTML_DESIGN_STANDARDS.md §Business Context Panel) */
.journey-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 16px;
}
.journey-card { border-radius: 8px; padding: 16px 18px; }
.journey-card.phase-1 { background: #F0FFF4; border: 1px solid #68D391; }
.journey-card.phase-2 { background: #FFFBEB; border: 1px solid #F6D860; }
.journey-card.phase-3 { background: #F5F0FF; border: 1px solid #C084FC; }
.jc-phase    { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; color: var(--mid); }
.jc-label    { font-size: 13px; font-weight: 700; color: var(--dark); margin-bottom: 4px; }
.jc-headline { font-size: 12px; font-weight: 600; color: var(--dark); margin-bottom: 4px; }
.jc-body     { font-size: 12px; color: var(--mid); line-height: 1.5; }

/* P0 blockers — internal only */
.bc-blockers {
  margin-top: 12px; padding: 12px 16px;
  background: #FEF2F2; border: 1px solid #FECACA; border-radius: 6px;
}
.bc-blockers h4 {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: #991B1B; margin-bottom: 8px;
}
.bc-blockers ul { list-style: none; padding: 0; }
.bc-blockers li {
  font-size: 12px; color: #7F1D1D;
  padding: 3px 0 3px 16px; position: relative;
}
.bc-blockers li::before { content: '⚠'; position: absolute; left: 0; font-size: 10px; }

/* ── INSTRUCTIONS ── */
.instructions { padding: 24px 0; border-bottom: 1px solid var(--border); }
.instructions h3 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--mid); margin-bottom: 10px;
}
.instructions ul { list-style: none; padding: 0; }
.instructions li {
  font-size: 13px; color: var(--mid); padding: 3px 0 3px 18px; position: relative;
}
.instructions li::before { content: '→'; position: absolute; left: 0; color: var(--brand); font-size: 12px; }
.instructions li strong { color: var(--dark); }

/* ── SECTION BLOCKS (HTML_DESIGN_STANDARDS.md §Section Headers) ── */
.section-block { border-bottom: 1px solid var(--border); padding: 40px 0; }
.section-block:last-of-type { border-bottom: none; }
.section-head {
  display: flex; align-items: baseline; gap: 10px;
  margin-bottom: 28px; padding-bottom: 14px; border-bottom: 1px solid var(--border);
}
.section-num   { font-size: 11px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
.section-title { font-size: 18px; font-weight: 700; color: var(--dark); }

/* ── UC BLOCKS (HTML_DESIGN_STANDARDS.md §Subsection / UC Blocks) ── */
.uc-block { margin-bottom: 36px; padding-bottom: 36px; border-bottom: 1px solid var(--border); }
.uc-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.uc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.uc-tag {
  font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
  background: var(--brand); color: #fff; padding: 2px 8px; border-radius: 4px;
}
.uc-head h3 { font-size: 16px; font-weight: 700; color: var(--dark); }
.uc-understood {
  border-left: 3px solid var(--border); padding: 10px 16px; margin-bottom: 16px;
}
.uc-understood strong {
  color: var(--mid); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.uc-understood ul { padding-left: 0; list-style: none; margin-top: 6px; }
.uc-understood li {
  font-size: 13px; color: var(--mid); padding: 2px 0 2px 16px; position: relative;
}
.uc-understood li::before { content: '·'; position: absolute; left: 4px; color: var(--mid); }

/* ── P0 BLOCKER ── */
.p0-block {
  background: #FEF2F2; border-left: 3px solid var(--brand);
  padding: 12px 16px; margin-bottom: 16px; border-radius: 0 6px 6px 0;
}
.p0-block .p0-label {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1px; color: #991B1B; margin-bottom: 4px;
}
.p0-block p { font-size: 13px; color: #7F1D1D; margin: 0; line-height: 1.6; }
.p0-block p strong { color: #991B1B; }
.p0-block code {
  background: #FEE2E2; padding: 1px 4px;
  border-radius: 3px; font-family: monospace; font-size: 12px;
}

/* ── SCOPE BOUNDARY ── */
.scope-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 16px; }
.scope-item { padding: 10px 14px; border-radius: 6px; font-size: 12px; line-height: 1.5; }
.scope-in       { background: #F0FFF4; color: #276749; border: 1px solid #A7F3D0; }
.scope-assumed  { background: #FFFBEB; color: #7C5E10; border: 1px solid #FDE68A; }
.scope-out      { background: #FFF5F5; color: #9B2335; border: 1px solid #FECACA; }
.scope-item .scope-label {
  font-weight: 700; font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.5px; display: block; margin-bottom: 4px;
}

/* ── QUESTION BLOCKS (HTML_DESIGN_STANDARDS.md §Question Blocks) ── */
.q-block {
  margin-bottom: 28px; padding-bottom: 28px;
  border-bottom: 1px dashed var(--border);
}
.q-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.q-id {
  font-size: 11px; font-weight: 700; color: var(--brand);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px;
}
.q-text  { font-size: 15px; font-weight: 500; color: var(--dark); margin-bottom: 10px; line-height: 1.6; }
.q-hint  {
  font-size: 12px; color: var(--mid); font-style: italic;
  margin-bottom: 10px; padding: 8px 14px;
  background: #FAFAFA; border-left: 3px solid var(--border); border-radius: 0 4px 4px 0;
}
.q-options { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.pill {
  padding: 5px 14px; border-radius: 20px; font-size: 13px;
  cursor: pointer; border: 1px solid var(--border);
  background: #F7F7F7; color: var(--mid); transition: all 0.15s;
}
.pill:hover    { background: var(--light); border-color: var(--brand); color: var(--brand); }
.pill.selected { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }

/* Answer textarea states (HTML_DESIGN_STANDARDS.md §Question Blocks) */
textarea.answer {
  width: 100%; border: 1px solid var(--border); border-radius: 6px;
  padding: 10px 14px; font-size: 14px; font-family: inherit;
  resize: vertical; min-height: 52px; color: var(--dark);
  background: #fff; transition: all 0.15s; line-height: 1.6;
}
textarea.answer:focus    { outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(237,28,36,0.08); }
textarea.answer.is-prefilled { background: var(--amber-bg); border-color: #FDE68A; }
textarea.answer.is-answered  { background: #F0FFF4; border-color: #A7F3D0; }
textarea.answer.mandatory-empty { background: #FFF5F5; border-color: #F87171; }

/* ── TABLES (HTML_DESIGN_STANDARDS.md §Table Component) ── */
table.dtbl { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
table.dtbl th {
  background: var(--dark); color: #fff;
  font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
  padding: 10px 14px; text-align: left;
}
table.dtbl td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.dtbl tr:nth-child(even) td { background: #FAFAFA; }
table.dtbl tr:last-child td { border-bottom: none; }
table.dtbl input.tbl-ans {
  width: 100%; border: 1px solid var(--border); border-radius: 4px;
  padding: 5px 8px; font-size: 12px; font-family: inherit; background: #fff;
}
table.dtbl input.tbl-ans.is-prefilled { background: var(--amber-bg); border-color: #FDE68A; }
.tbl-hint {
  font-size: 12px; color: var(--mid); font-style: italic;
  margin-bottom: 8px; padding: 8px 14px;
  background: #FAFAFA; border-left: 3px solid var(--border); border-radius: 0 4px 4px 0;
}

/* ── INTERNAL FLAGS ── */
.internal-block { border-top: 2px solid #FDE68A; padding: 32px 0; }
.internal-block h3 {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: #92400E; margin-bottom: 20px;
}
.flag-item { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid #FDE68A; }
.flag-item:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
.flag-num  { font-size: 10px; font-weight: 700; color: #92400E; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
.flag-body { font-size: 13px; color: #78350F; line-height: 1.6; }
.flag-body code { background: #FEF3C7; padding: 1px 5px; border-radius: 3px; font-family: monospace; font-size: 12px; }

/* ── ACCESS CHAIN TABLE ── */
.access-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.access-table th {
  background: var(--dark); color: #fff;
  font-size: 10px; font-weight: 600; letter-spacing: 0.5px;
  padding: 8px 12px; text-align: left;
}
.access-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.access-table tr:nth-child(even) td { background: #FAFAFA; }
.access-table tr:last-child td { border-bottom: none; }
.status-badge {
  display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
}
.status-ok      { background: #D1FAE5; color: #065F46; }
.status-pending { background: #FEF3C7; color: #92400E; }
.status-blocked { background: #FEE2E2; color: #991B1B; }

/* ── FOOTER ── */
.footer {
  border-top: 1px solid var(--border);
  padding: 20px 56px; font-size: 12px; color: var(--mid);
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 32px;
}
.footer strong { color: var(--dark); }
.footer a { color: var(--mid); text-decoration: none; }

/* ── PRINT (HTML_DESIGN_STANDARDS.md §Print / PDF Stylesheet) ── */
@media print {
  .sticky-bar, .no-print { display: none !important; }
  body { background: #fff; font-size: 11px; }
  .wrap { padding: 0 32px; }
  textarea.answer, .tbl-ans { background: #fff !important; border: 1px solid #ccc !important; }
  .bc-blockers { display: none !important; }
  .p0-block { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  details.uc-block { border: none; }
  details.uc-block[open], details.uc-block:not([open]) { display: block; }
  summary.uc-head { background: none; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .uc-chevron { display: none; }
  .section-block { page-break-inside: avoid; }
  .pill { display: none; }
  .pill.selected::before { content: '✓ '; }
  .pill.selected { display: inline; background: none; color: var(--dark); border: none; font-weight: 600; }
}
</style>
