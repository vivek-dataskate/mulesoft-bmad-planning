openapi: "3.0.3"
info:
  title: "{{API_TITLE}}"
  description: |
    {{API_DESCRIPTION}}

    Generated stub — developer completes field-level schema before publishing to Exchange.
    Layer: {{API_LAYER}} (system | process | experience)
    Source: {{FLOW_SOURCE}} → Target: {{FLOW_TARGET}}
  version: "1.0.0"
  contact:
    name: "{{PROJECT_TEAM}}"

servers:
  - url: "https://{environment}.{{base_url}}/api/v1"
    description: "CloudHub 2.0 — environment-specific"
    variables:
      environment:
        enum: ["dev", "uat", "prod"]
        default: "dev"

# Security applied at operation level — Flex Gateway enforces at runtime.
# client-id-enforcement policy validates client_id + client_secret pair.
# Both schemes in the same list item = AND requirement (both headers required).
security:
  - clientIdScheme: []
    clientSecretScheme: []

components:
  securitySchemes:
    # internal tier: Client-ID + Client-Secret headers (Flex Gateway client-id-enforcement policy)
    # Both headers are required for all endpoints in the internal security tier.
    clientIdScheme:
      type: apiKey
      in: header
      name: client_id
      description: |
        Anypoint Platform client_id. Must be paired with client_secret header.
        Both are validated by Flex Gateway before the request reaches Mule.
    clientSecretScheme:
      type: apiKey
      in: header
      name: client_secret
      description: "Anypoint Platform client_secret. Paired with client_id header."

    # partner/regulated tier — OAuth 2.0 Client Credentials (uncomment if applicable)
    # oauth2ClientCredentials:
    #   type: oauth2
    #   flows:
    #     clientCredentials:
    #       tokenUrl: "https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token"
    #       scopes:
    #         read: "Read access"
    #         write: "Write access"

  schemas:
    # ── Error Envelope ────────────────────────────────────────────────────
    # This schema is common to all APIs in this system — keep it identical.
    ErrorEnvelope:
      type: object
      required: [correlationId, errorCode, message, timestamp]
      properties:
        correlationId:
          type: string
          format: uuid
          description: "Trace ID — include in all support requests. Echoed in X-Correlation-ID response header."
        errorCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - SERVICE_UNAVAILABLE
            - AUTHORIZATION_ERROR
            - INTERNAL_ERROR
        message:
          type: string
          description: "Human-readable error description. Never contains stack traces or internal system details."
        timestamp:
          type: string
          format: date-time
        failingComponent:
          type: string
          description: "Mule component that raised the error"

    # ── TODO: Define request body schema ────────────────────────────────
    # Copy field names from architecture.md Field Mapping table for this flow.
    # {{FLOW_NAME}}Request:
    #   type: object
    #   required: []  # List required fields
    #   properties:
    #     id:
    #       type: string
    #       description: "TODO: describe field"

    # ── TODO: Define response body schema ──────────────────────────────
    # {{FLOW_NAME}}Response:
    #   type: object
    #   properties:
    #     id:
    #       type: string

  parameters:
    # Reusable correlation ID header parameter
    correlationIdHeader:
      name: "X-Correlation-ID"
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: "Client-provided trace ID. If absent, the API generates one and returns it."

paths:
  # ── TODO: Define API endpoints ─────────────────────────────────────────
  # Replace {entity} with the actual resource name from decisions.json flows[].
  # Add one path block per HTTP method needed (POST create, GET query, PUT update).
  "{{HTTP_PATH}}":
    post:
      summary: "TODO: Describe this operation"
      operationId: "{{FLOW_NAME}}"
      tags:
        - "{{domain}}"
      security:
        - clientIdScheme: []
      parameters:
        - $ref: '#/components/parameters/correlationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # TODO: $ref: '#/components/schemas/{{FLOW_NAME}}Request'
              type: object
              description: "TODO: Replace with {{FLOW_NAME}}Request schema"
            example:
              id: "example-001"
              # TODO: add realistic example fields from architecture.md Field Mapping table
      responses:
        "200":
          description: "Success"
          headers:
            X-Correlation-ID:
              schema:
                type: string
              description: "Correlation ID for tracing — echo of inbound header or generated UUID"
          content:
            application/json:
              schema:
                # TODO: $ref: '#/components/schemas/{{FLOW_NAME}}Response'
                type: object
        "400":
          description: "Validation error — message is structurally or semantically invalid (not retryable)"
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: "Missing or invalid client credentials (client_id / client_secret)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "500":
          description: "Unexpected internal error — correlationId included for support reference"
          headers:
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: "Downstream system temporarily unavailable — retry with exponential backoff"
          headers:
            Retry-After:
              schema:
                type: integer
              description: "Seconds to wait before retry"
            X-Correlation-ID:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

