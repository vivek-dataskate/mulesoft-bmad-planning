# Drew — Portfolio Map Analyst
# Pipeline position: TBD (between Vera and Rex, or as an on-demand follow-up to Vera)
# Interaction mode: CONVERSATIONAL
# Model: Opus
# Status: PARKED — not yet designed. Stub exists so any future pipeline.json reference does not break on unpark.
#
# Drew's planned scope: deeper portfolio-mapping for clients where Vera's Step 2b Tier-A pass
# (capped at 3 priority siblings × 4 searches) is insufficient. For example: a 15-sibling
# platform where every sibling deserves IT-leader + value-prop + IT-stack + use-case-transfer
# research, not just the top 3.
#
# Rationale: Vera v1.1.0 is locked. Adding more per-sibling depth to Vera would push her over
# the Opus 200k context ceiling. The right move is to delegate exhaustive portfolio mapping
# to a separate agent that runs after Vera with isolated context — each sibling can get its
# own sub-agent fan-out, results merged into a portfolio-map artifact.
#
# Triggers for activating Drew (any of):
#   - corporateStack.operatingPlatform.siblingsTruncated == true with siblingCount > 8
#   - hawk.json.portfolioTemplateFraming.siblingsWithIntegrationFootprint < siblingCount/2
#     (too many siblings unresolved — opportunity sizing requires it)
#   - User explicit request: "map the full portfolio in depth"
#
# Out-of-scope for Drew (already covered by Vera): operating brand, leadership, sponsor,
# platform exec team, current-engagement buyer map, corporate profile narrative.
# In-scope for Drew: per-sibling deep dives at scale + cross-sibling pattern analysis.

[agent]
name = "Drew"
slug = "drew"
role = "Portfolio Map Analyst"
model = "opus"
interaction = "conversational"
version = "0.0.0-stub"

reads = []
writes = [
  "projects/{client}/scoping/run/drew.json",
]

principles = [
  "STUB — Drew is parked. This TOML is a placeholder only. Do not run Drew until the principle set and workflow are fully designed and reviewed. Vera v1.1.0 covers the top 3 priority siblings; Drew covers the long tail when a platform's sibling count exceeds Vera's Tier-A cap.",
]

workflow = """
=== DREW WORKFLOW ===

STUB — Drew is parked. Remove this stub and design the full workflow before activating.

Activation precondition: Vera v1.1.0 has completed AND corporateStack.operatingPlatform.siblingsTruncated == true
OR the user has explicitly requested deep portfolio mapping beyond Vera's Tier-A cap.

Output if accidentally invoked:
{ "status": "invalid", "reason": "Drew is parked — TOML is a stub only. Design and activate Drew before running. Vera v1.1.0 covers Tier-A siblings; Drew is the long-tail follow-up." }
"""
