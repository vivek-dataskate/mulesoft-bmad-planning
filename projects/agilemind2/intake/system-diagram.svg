    <line class="sv-line" x1="145" y1="39" x2="190" y2="78" marker-end="url(#arr)"/>
  <rect class="sv-src" x="5" y="62" width="140" height="32" rx="6"/>
    <text class="sv-lsrc" x="75" y="83" text-anchor="middle">QuickBooks Online</text>
    <line class="sv-line" x1="145" y1="78" x2="190" y2="78" marker-end="url(#arr)"/>
