<svg viewBox="0 0 500 120" style="width:100%;max-width:500px;height:auto;display:block;margin:8px auto;" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 Z" fill="var(--border)"/></marker>
    <style>
      .sv-src,.sv-tgt{fill:#fff;stroke:var(--border);stroke-width:1.5}
      .sv-hub{fill:#E8F5EE;stroke:var(--green);stroke-width:2}
      .sv-line{stroke:var(--border);stroke-width:1.5;fill:none}
      .sv-lsrc,.sv-ltgt{font:600 11px system-ui,sans-serif;fill:var(--dark)}
      .sv-lhub{font:700 12px system-ui,sans-serif;fill:var(--green)}
      .sv-lsub{font:400 9px system-ui,sans-serif;fill:var(--green)}
    </style>
  </defs>
  <rect class="sv-src" x="5" y="24" width="140" height="32" rx="6"/>
    <text class="sv-lsrc" x="75" y="45" text-anchor="middle">Shopify Plus</text>
    <line class="sv-line" x1="145" y1="40" x2="190" y2="60" marker-end="url(#arr)"/>
  <rect class="sv-src" x="5" y="64" width="140" height="32" rx="6"/>
    <text class="sv-lsrc" x="75" y="85" text-anchor="middle">Orderful EDI</text>
    <line class="sv-line" x1="145" y1="80" x2="190" y2="60" marker-end="url(#arr)"/>
  <rect class="sv-hub" x="190" y="34" width="120" height="52" rx="8"/>
  <text class="sv-lhub" x="250" y="56" text-anchor="middle">MuleSoft</text>
  <text class="sv-lsub" x="250" y="72" text-anchor="middle">DataSkate Managed</text>
  <rect class="sv-tgt" x="355" y="24" width="140" height="32" rx="6"/>
    <text class="sv-ltgt" x="425" y="45" text-anchor="middle">NetSuite</text>
    <line class="sv-line" x1="310" y1="60" x2="355" y2="40" marker-end="url(#arr)"/>
  <rect class="sv-tgt" x="355" y="64" width="140" height="32" rx="6"/>
    <text class="sv-ltgt" x="425" y="85" text-anchor="middle">ShipStation</text>
    <line class="sv-line" x1="310" y1="60" x2="355" y2="80" marker-end="url(#arr)"/>
</svg>