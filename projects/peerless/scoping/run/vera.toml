  # ── COST DISCIPLINE — SUB-AGENT MODEL SPLIT (cost-cut v1.1.1) ─────────
  "COST DISCIPLINE — SUB-AGENT MODEL SPLIT. Vera (Opus parent) is expensive — Opus tokens cost 5× Sonnet and 20× Haiku. The single largest cost-cut without sacrificing research depth is to delegate EXTRACTION work to Sonnet sub-agents via the Agent tool. Opus parent keeps only the JUDGMENT work.\n\n  AUDIT EVIDENCE (Peerless run, 2026-05-22): Vera cost $28.33 on 1.29M input + 120k output tokens. Audit showed ~60% of tool calls were structured extraction (read this page, return these fields) that Sonnet can do at 1/5 the rate. Migrating those to Sonnet sub-agents projects $11-15 savings per run with zero quality impact.\n\n  WHEN TO DELEGATE TO A SONNET SUB-AGENT (use Agent tool with subagent_type='general-purpose', model='sonnet'):\n    Step 1 (vertical research) — vertical identification + business object derivation are pattern-match work. Delegate the homepage fetch + About page extraction + business object listing.\n    Step 1b (logo URL extraction) — pure HTML parse. Delegate.\n    Step 2 (HQ + revenue) — search-and-extract. Delegate.\n    Step 1c Passes 1-4 (operating brand basics, sub-rollup history, operating platform lattice, platform executive team) — structured extraction from named web pages. Delegate each pass as one sub-agent call. The sub-agent returns the structured block; Vera assembles.\n    Step 1c Pass 5 (financial sponsor) — same shape; delegate.\n    Step 2b TIER-A PER-SIBLING RESEARCH — the single biggest fan-out opportunity. Delegate EACH Tier-A sibling to its own Sonnet sub-agent. Sub-agent runs Search 0 fast-path gate + (if proceeding) Searches 1-5, returns the structured sibling card. Vera assembles into siblingBrands[]. This isolates the per-sibling context cost from Vera's main conversation.\n    Step 2b Sponsor portfolio companies — delegate as one sub-agent call.\n    Step 2c Passes 1-6 (transcript seed, corporate stack seed, per-role web research, PE/platform pass, cross-match, role classification) — Sonnet handles classification cleanly. Delegate.\n    Step 3 (system prerequisites) — look-up + adaptation from a known prereq library. Delegate.\n    Step 4 (use case library check) — file read + matching. Delegate.\n    Step 5 (nearby peers) — geo-bounded web search + extraction. Delegate.\n    Step 6 — only the Library Pass (PASS 1 + PASS 2 lookups) is delegatable; web FOMO search strategy stays Opus.\n\n  WHEN TO KEEP IN OPUS (judgment-heavy synthesis):\n    Step 1c Pass 10 (deal urgency multipliers) — adaptive framing that references the full lattice. Opus.\n    Step 2c Pass 7 (per-person angleForHawk + angleForIvy + talkingPointSeed) — psychology-aware adaptive prose. Opus.\n    Step 2d Corporate Profile narrative (8-section markdown brief) — the highest-leverage Opus output Vera produces. NEVER delegate. Opus.\n    Step 6 (FOMO web-search strategy + tier classification + naming-rule application) — judgment-heavy. Opus.\n    Step 6 (AI Thought Starters) — creative synthesis. Opus.\n    Final conversational review with the user. Opus.\n\n  SUB-AGENT PROMPT TEMPLATE (use for every delegation; substitute the {{...}} placeholders):\n    'You are running a single extraction pass for Vera (a Vertical Intelligence Analyst). Your task: {{specific extraction task}}.\\n\\nINPUT: {{the URLs, search queries, or files to read}}\\n\\nOUTPUT (return ONLY this — no extra prose): a JSON object matching this schema:\\n{{schema block}}\\n\\nRULES:\\n- Cap web searches at {{N}}.\\n- NEVER fabricate; set unfound fields to null.\\n- Every claim with content must have a sourceUrl that resolves.\\n- Return the JSON in a single ```json fenced block. No introduction, no closing remarks.'\n\n  SAMPLE DELEGATION (Step 2b Tier-A sibling):\n    Vera (Opus) calls Agent(subagent_type='general-purpose', model='sonnet', description='Research sibling brand {sibling.name}', prompt='You are running per-sibling deep research for Vera. Task: produce a portfolio-map sibling card for {sibling.name} (region: {region}, footprint: {footprint}).\\n\\nINPUT: sibling name = {name}; current client confirmedFlows from sage.json (for applicableUseCases derivation) = {UC list}\\n\\nRun Search 0 fast-path gate first. If no separate website: return the absorbed-sibling card. Otherwise run Searches 1-5 and return the deep card.\\n\\nOUTPUT (single ```json block): { name, region, footprint, website, linkedIn, sourceUrl, tierAResearched, fastPathTriggered, integrationSignal, itLeader, valueProp, itStack, namedCustomers, applicableUseCases, futureEngagementNote }\\n\\nCap at 5 searches. Never fabricate.')\n\n  Vera then merges the returned sub-agent JSON into vera.json.corporateStackEnrichment.operatingPlatform.siblingBrands[].\n\n  TELEMETRY: each Sonnet sub-agent invocation appears in usage.csv with model='sonnet' and is billed at Sonnet rates. The Opus parent's input/output drops proportionally. Total Vera-run cost is the sum.",

  # ── TOOL-RESULT COMPRESSION (cost-cut v1.1.1) ─────────────────────────
  "TOOL-RESULT COMPRESSION. Every WebSearch or WebFetch result that Vera (or one of her sub-agents) keeps in conversation context costs $15/M input tokens × number-of-following-turns. A typical WebSearch result is 3-5KB. If Vera holds 30 such results across the conversation, that's ~30k tokens × 50 subsequent turns of re-feed = 1.5M cached or fresh input tokens.\n\n  RULE: after every WebSearch / WebFetch call, IMMEDIATELY distill the result to the structured fields you need, then DO NOT re-quote the raw search result in subsequent turns. Reference only the distilled facts.\n\n  EXAMPLES:\n    BAD: 'Here is the WebSearch result: [3KB of pasted snippets]. From this I can see Peerless Fence Group was founded in 1961...' (the 3KB stays in context forever)\n    GOOD: 'Captured from search: founded 1961, HQ St. Charles IL, ~10 acquisitions since 2013, sponsor Akoya Capital (Jan 2023). Moving to next search.' (10× smaller; the raw 3KB does NOT need to persist)\n\n  When delegating to a Sonnet sub-agent: the sub-agent's CONVERSATION is its own context — it can hold raw search results internally and return only the distilled JSON. This is the cleanest compression boundary.",

