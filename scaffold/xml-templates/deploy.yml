name: "Deploy {{artifactId}} to CloudHub 2.0"

on:
  push:
    branches:
      - main        # production deploy on merge to main
      - develop     # UAT deploy on merge to develop (remove if UAT is manual-only)
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options: [dev, uat, prod]

env:
  MULE_RUNTIME: "4.8.0"
  JAVA_VERSION: "17"
  APP_NAME: "{{artifactId}}"

jobs:
  # ── Job 1: Build + Test ──────────────────────────────────────────────
  build-and-test:
    name: "Build and MUnit Test"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: "Cache Maven packages"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: "Configure Maven Settings (Anypoint Exchange)"
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]

      - name: "Build and Run MUnit Tests"
        run: mvn clean package --batch-mode --no-transfer-progress
        env:
          MULE_ENV: "dev"   # MUnit always runs against dev config

      - name: "Upload MUnit Coverage Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "munit-coverage-report"
          path: target/site/munit/coverage/

      # Upload the built Mule application artifact so the deploy job
      # doesn't need to rebuild — avoids a second full Maven compile.
      - name: "Upload Mule Application Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "mule-application"
          path: target/*.jar
          retention-days: 1

  # ── Job 2: Deploy ────────────────────────────────────────────────────
  deploy:
    name: "Deploy to CloudHub 2.0 (${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }})"
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}
    # Production: enable required reviewers in GitHub Environments settings for the 'prod' environment.

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Set up JDK ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: "temurin"

      - name: "Cache Maven packages"
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: "Configure Maven Settings (Anypoint Exchange)"
        uses: s4u/maven-settings-action@v3.0.0
        with:
          servers: |
            [
              {
                "id": "anypoint-exchange-v3",
                "username": "~~~Client~~~",
                "password": "${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}~?~${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}"
              }
            ]

      # Download the pre-built artifact from Job 1 — no recompile needed.
      - name: "Download Mule Application Artifact"
        uses: actions/download-artifact@v4
        with:
          name: "mule-application"
          path: target/

      - name: "Resolve deploy environment"
        id: env
        run: |
          if [ -n "${{ github.event.inputs.environment }}" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
          else
            echo "target=uat" >> $GITHUB_OUTPUT
          fi

      - name: "Deploy to CloudHub 2.0"
        run: |
          mvn deploy -DmuleDeploy \
            --batch-mode \
            --no-transfer-progress \
            -DskipTests \
            -Danypoint.connectedApp.clientId=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }} \
            -Danypoint.connectedApp.clientSecret=${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }} \
            -Danypoint.environment=${{ steps.env.outputs.target }} \
            -Dmule.env=${{ steps.env.outputs.target }}
        env:
          # Required secrets (GitHub repo Settings → Secrets → Actions):
          #   ANYPOINT_CONNECTED_APP_CLIENT_ID
          #   ANYPOINT_CONNECTED_APP_CLIENT_SECRET
          # Required environment config in GitHub Environments:
          #   Environment 'prod' → enable required reviewers for production gate
          ANYPOINT_CONNECTED_APP_CLIENT_ID: ${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_ID }}
          ANYPOINT_CONNECTED_APP_CLIENT_SECRET: ${{ secrets.ANYPOINT_CONNECTED_APP_CLIENT_SECRET }}
